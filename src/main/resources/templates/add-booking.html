<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tambah Tempahan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="max-w-lg mx-auto mt-10 bg-white shadow-lg p-8 rounded-lg">
    <h1 class="text-2xl font-bold mb-6 text-center">Tambah Tempahan Baru</h1>

    <form th:action="@{/add}" th:object="${booking}" method="post" class="space-y-4">
      <div>
        <label class="block font-medium">Nama Pelanggan</label>
        <input type="text" th:field="*{customerName}" class="w-full border rounded px-3 py-2 focus:outline-blue-500" />
      </div>

      <div>
        <label class="block font-medium">Jenis Perkhidmatan</label>
        <input type="text" th:field="*{serviceType}" class="w-full border rounded px-3 py-2 focus:outline-blue-500" />
      </div>

      <div>
        <label class="block font-medium">Masa Temu Janji</label>
        <input type="text" th:field="*{appointmentTime}" placeholder="cth: 3:00 PM" class="w-full border rounded px-3 py-2 focus:outline-blue-500" />
      </div>

      <div class="flex justify-between mt-6">
        <a href="/" class="text-gray-600 hover:text-gray-800">← Kembali</a>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Simpan</button>
      </div>
    </form>
  </div>

</body>
</html>
