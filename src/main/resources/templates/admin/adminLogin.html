<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hugi Barbershop System - Staff Login</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/fontawesome/css/all.min.css}">
</head>

<body class="nk-body" style="background-color: #f4f7f6;">
    <div class="nk-app-root">
        <div class="nk-main">
            <div class="nk-wrap align-items-center justify-content-center" style="min-height: 100vh; display: flex;">
                <div class="container p-2 p-sm-4">
                    <div class="wide-xs mx-auto">
                        <div class="card card-gutter-lg rounded-4 shadow-sm">
                            <div class="card-body">
                                <div class="nk-block-head text-center">
                                    <div class="nk-block-head-content">
                                        <h3 class="nk-block-title mb-1">Staff Login</h3>
                                        <p class="small text-muted">Please sign-in to your account.</p>
                                    </div>
                                </div>
                                <form th:action="@{/staffAuth}" method="post">
                                    <div class="row gy-3">
                                        <div th:if="${loginError}" class="col-12">
                                            <div class="alert alert-danger" th:text="${loginError}"></div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label class="form-label">Email</label>
                                                <div class="form-control-wrap">
                                                    <input type="email" class="form-control" name="email"
                                                        placeholder="Enter your email" required>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label class="form-label">Password</label>
                                                <div class="form-control-wrap" style="position:relative;">
                                                    <input type="password" class="form-control" name="password" id="adminLoginPassword"
                                                        placeholder="Enter your password" required style="padding-right:2.5rem;">
                                                    <button type="button" data-target="adminLoginPassword"
                                                        class="btn btn-link password-toggle"
                                                        tabindex="-1" aria-label="Show password"
                                                        style="position:absolute;top:50%;right:0;transform:translateY(-50%);padding:0.3rem 0.5rem;text-decoration:none;color:#6c757d;">
                                                        <i class="fas fa-eye eye-icon"></i>
                                                        <i class="fas fa-eye-slash eye-off-icon" style="display:none;"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12 mt-4">
                                            <div class="d-grid">
                                                <button type="submit" class="btn btn-primary">Login</button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- ✅ MODAL DIALOG -->
        <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true"
            th:classappend="${forceLogoutModal} ? 'show d-block' : ''">

            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="logoutModalLabel">Session Ended</h5>
                        <!-- ✅ BUTANG X: Tambah onclick="forceCloseModal()" -->
                        <button type="button" class="btn-close" onclick="forceCloseModal()" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p><strong>Your email has been changed.</strong></p>
                        <p>You have been logged out. Please login again.</p>
                    </div>
                    <div class="modal-footer">
                        <!-- ✅ BUTANG OK: Tambah onclick="forceCloseModal()" -->
                        <button type="button" class="btn btn-primary" onclick="forceCloseModal()">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ✅ BACKGROUND OVERLAY (LAYER HITAM) -->
        <div th:if="${forceLogoutModal}" class="modal-backdrop fade show"></div>

        <!-- ✅ JAVASCRIPT: Fungsi Khas Tutup Modal -->
        <script th:if="${forceLogoutModal}">
            function forceCloseModal() {
                // 1. Dapatkan elemen modal
                var modalElement = document.getElementById('logoutModal');

                // 2. Buang class 'show' dan 'd-block' untuk sembunyikan modal
                modalElement.classList.remove('show');
                modalElement.classList.remove('d-block');

                // 3. Cari dan buang background gelap (modal-backdrop)
                var backdrop = document.querySelector('.modal-backdrop');
                if (backdrop) {
                    backdrop.remove();
                }

                // 4. Enable scroll balik pada body (selalunya modal disable scroll)
                document.body.classList.remove('modal-open');
                document.body.style.overflow = '';
            }
        </script>
    <div th:replace="~{fragments/adminScripts :: adminJs}"></div>

    <script>
        // Password visibility toggle
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.password-toggle').forEach(function (button) {
                button.addEventListener('click', function () {
                    var input = document.getElementById(button.getAttribute('data-target'));
                    if (!input) return;

                    var isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';

                    var eyeIcon = button.querySelector('.eye-icon');
                    var eyeOffIcon = button.querySelector('.eye-off-icon');
                    if (eyeIcon) eyeIcon.style.display = isPassword ? 'none' : 'inline-block';
                    if (eyeOffIcon) eyeOffIcon.style.display = isPassword ? 'inline-block' : 'none';

                    button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            });
        });
    </script>

</body>

</html>
