<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hugi Barbershop System - Appointments</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/fontawesome/css/all.min.css}">
</head>

<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">
    <div class="nk-app-root">
        <div class="nk-main">
            <div th:replace="~{fragments/adminFragments :: sidebar}"></div>
            <div class="nk-wrap">
                <div th:replace="~{fragments/adminFragments :: header}"></div>
                <div class="nk-content text-left">
                    <div class="container">
                        <div class="nk-block-head">
                            <h2 class="nk-block-title">Appointment List</h2>
                        </div>
                        <div class="nk-block">
                            <div style="display:flex; gap:20px; align-items:flex-start;">

                                <!-- ================= TABLE ================= -->
                                <div style="flex:2;">
                                    <div class="card">
                                        <table class="table">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>Customer Name</th>
                                                    <th>Date/Time</th>
                                                    <th>Customer Category</th>
                                                    <th>Payment Method</th>
                                                    <th>Payment</th>
                                                    <th>Service</th>

                                                    <!-- ✅ ACTION HEADER: Hanya Admin nampak -->
                                                    <th th:if="${staffRole == 'ADMIN'}">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr th:each="a : ${appointmentList}">
                                                    <td th:text="${a.customerName}"></td>
                                                    <td th:text="${a.appointmentDate + ' ' + a.appointmentTime}"></td>
                                                    <td th:text="${a.custType}"></td>
                                                    <td th:text="${a.paymentMethod}"></td>

                                                    <td>
                                                        <!-- =========================================
                                                            PAYMENT COLUMN LOGIC
                                                        ========================================= -->

                                                        <!-- SCENARIO 1: ONLINE (View Only untuk kedua-dua) -->
                                                        <span th:if="${a.paymentMethod == 'ONLINE'}"
                                                            class="badge bg-success">
                                                            Completed
                                                        </span>

                                                        <!-- SCENARIO 2: CASH - ADMIN VIEW (Boleh Update) -->
                                                        <form
                                                            th:if="${a.paymentMethod == 'CASH' and staffRole == 'ADMIN'}"
                                                            th:action="@{/admin/update-payment-status}" method="post"
                                                            class="d-inline">
                                                            <input type="hidden" name="appointmentId"
                                                                th:value="${a.appointmentId}" />

                                                            <!-- Button: COMPLETED -->
                                                            <button th:if="${a.paymentStatus == 'completed'}"
                                                                type="submit" class="btn btn-success btn-sm">
                                                                Completed
                                                            </button>

                                                            <!-- Button: PENDING -->
                                                            <button th:if="${a.paymentStatus == 'pending'}"
                                                                type="submit" name="status" value="completed"
                                                                class="btn btn-warning btn-sm">
                                                                Pending
                                                            </button>
                                                        </form>

                                                        <!-- SCENARIO 3: CASH - BARBER VIEW (Disabled/Badge Sahaja) -->
                                                        <!-- Barber tak boleh update, jadi kita tunjuk badge status je -->
                                                        <div
                                                            th:if="${a.paymentMethod == 'CASH' and staffRole == 'BARBER'}">
                                                            <span th:if="${a.paymentStatus == 'completed'}"
                                                                class="badge bg-success">Completed</span>
                                                            <span th:if="${a.paymentStatus == 'pending'}"
                                                                class="badge bg-warning">Pending</span>
                                                        </div>

                                                        <!-- SCENARIO 4: FALLBACK -->
                                                        <span th:if="${a.paymentMethod == null}"
                                                            class="badge bg-secondary">No Payment</span>
                                                    </td>

                                                    <td>
                                                        <!-- =========================================
                                                        SERVICE COLUMN LOGIC
                                                        ========================================= -->

                                                        <!-- SCENARIO 1: SERVICE STATUS - ADMIN VIEW (Boleh Update) -->
                                                        <form th:if="${staffRole == 'ADMIN'}"
                                                            th:action="@{/admin/update-service-status}" method="post"
                                                            class="d-inline">
                                                            <input type="hidden" name="appointmentId"
                                                                th:value="${a.appointmentId}" />

                                                            <!-- Button: DONE -->
                                                            <button th:if="${a.serviceStatus == 'done'}" type="submit"
                                                                name="status" value="cancelled"
                                                                class="btn btn-success btn-sm">
                                                                Done
                                                            </button>

                                                            <!-- Button: PENDING -->
                                                            <button th:if="${a.serviceStatus == 'pending'}"
                                                                type="submit" name="status" value="done"
                                                                class="btn btn-warning btn-sm">
                                                                Pending
                                                            </button>

                                                            <!-- Button: CANCELLED -->
                                                            <button th:if="${a.serviceStatus == 'cancelled'}"
                                                                type="submit" name="status" value="pending"
                                                                class="btn btn-danger btn-sm">
                                                                Cancelled
                                                            </button>
                                                        </form>

                                                        <!-- SCENARIO 2: SERVICE STATUS - BARBER VIEW (Disabled/Badge Sahaja) -->
                                                        <!-- Barber tak boleh update status service -->
                                                        <div th:if="${staffRole == 'BARBER'}">
                                                            <span th:if="${a.serviceStatus == 'done'}"
                                                                class="badge bg-success">Done</span>
                                                            <span th:if="${a.serviceStatus == 'pending'}"
                                                                class="badge bg-warning">Pending</span>
                                                            <span th:if="${a.serviceStatus == 'cancelled'}"
                                                                class="badge bg-danger">Cancelled</span>
                                                        </div>
                                                    </td>

                                                    <!-- ✅ ACTION COLUMN: Hanya Admin nampak -->
                                                    <td th:if="${staffRole == 'ADMIN'}">
                                                        <a th:href="@{/listAppointment(appointmentId=${a.appointmentId})}"
                                                            class="btn btn-sm btn-icon">
                                                            <i class="fas fa-edit"></i>
                                                        </a>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- ================= EDIT PANEL ================= -->
                                <div style="flex:1; min-width:350px;">
                                    <div th:if="${appointment}" class="card" style="padding:30px;">
                                        <h5 class="mb-3">
                                            <i class="fas fa-edit me-2"></i>
                                            Edit Appointment
                                        </h5>

                                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show"
                                            role="alert">
                                            <span th:text="${success}"></span>
                                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                        </div>

                                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"
                                            role="alert">
                                            <span th:text="${error}"></span>
                                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                        </div>

                                        <form th:action="@{/admin/update-appointment}" method="post">

                                            <!-- HIDDEN ID -->
                                            <input type="hidden" name="appointmentId"
                                                th:value="${appointment.appointmentId}" />

                                            <!-- INFO SAHAJA (Readonly - Tak perlu hantar ke server sebab tak nak update) -->
                                            <div class="mb-3">
                                                <label class="form-label">Booking For</label>
                                                <input type="text" class="form-control"
                                                    th:value="${appointment.custBookFor}" readonly>
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label">Customer Category</label>
                                                <input type="text" class="form-control"
                                                    th:value="${appointment.custType}" readonly>
                                            </div>

                                            <!-- YANG BOLEH DIUBAH -->

                                            <!-- 1. Date -->
                                            <div class="form-group mb-3">
                                                <label class="form-label">Date</label>
                                                <input type="date" class="form-control" id="editDate"
                                                    name="appointmentDate" th:value="${appointment.appointmentDate}"
                                                    onchange="updateAvailableTimes()">
                                            </div>

                                            <!-- 2. Time -->
                                            <div class="form-group mb-3">
                                                <label class="form-label">Time</label>
                                                <select class="form-select" id="editTime" name="appointmentTime"
                                                    required>
                                                    <option value="">Select Time</option>
                                                </select>
                                                <input type="hidden" id="originalTime"
                                                    th:value="${appointment.appointmentTime}">
                                            </div>

                                            <!-- 3. Barber -->
                                            <div class="form-group mb-3">
                                                <label class="form-label">Barber</label>
                                                <select class="form-select" id="editBarber" name="barberId"
                                                    onchange="updateAvailableTimes()">
                                                    <option th:each="b : ${barberList}" th:value="${b.staffId}"
                                                        th:text="${b.staffName}" th:selected="${appointment != null && appointment.barberId ==
                                                        b.staffId}">
                                                    </option>
                                                </select>
                                            </div>

                                            <!-- BUTTON -->
                                            <div class="d-flex justify-content-end gap-2 mt-4">
                                                <a th:href="@{/listAppointment}" class="btn btn-light btn-sm">Cancel</a>
                                                <button type="submit" class="btn btn-primary btn-sm">
                                                    <i class="fas fa-save me-1"></i>Save
                                                </button>
                                            </div>

                                        </form>
                                    </div>

                                    <div th:if="${param.appointmentId != null and appointment == null}"
                                        class="alert alert-danger mt-3">
                                        Appointment not found.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <div th:replace="~{fragments/adminScripts :: adminJs}"></div>
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                const today = new Date().toISOString().split('T')[0];
                const dateInput = document.getElementById('editDate');
                if (dateInput) {
                    dateInput.setAttribute('min', today);
                    // Add change listener to validate past dates
                    dateInput.addEventListener('change', function() {
                        if (this.value && this.value < today) {
                            this.value = '';
                            alert('Cannot select a past date.');
                        }
                    });
                }

                // ✅ PENTING: Panggil updateAvailableTimes() sekali pada load
                // ini akan isi dropdown masa dengan data yang betul bila edit panel dibuka
                updateAvailableTimes();
            });

            function isTimeInPast(dateStr, timeStr) {
                if (!dateStr || !timeStr) return false;
                
                try {
                    // Convert time format (e.g., "02:00 pm" -> "14:00")
                    const timeParts = timeStr.split(' ');
                    const [hour, minute] = timeParts[0].split(':');
                    let h = parseInt(hour);
                    const ampm = timeParts[1].toLowerCase();
                    
                    if (ampm === 'pm' && h !== 12) h += 12;
                    if (ampm === 'am' && h === 12) h = 0;
                    
                    const appointmentDateTime = new Date(dateStr + ' ' + String(h).padStart(2, '0') + ':' + minute);
                    const now = new Date();
                    
                    return appointmentDateTime < now;
                } catch (e) {
                    return false;
                }
            }

            function updateAvailableTimes() {
                const date = document.getElementById('editDate').value;
                const barberId = document.getElementById('editBarber').value;
                const timeSelect = document.getElementById('editTime');
                const appointmentId = document.querySelector('input[name="appointmentId"]')?.value;
                const currentlySelectedTime = timeSelect.value;

                // Kosongkan dropdown dulu
                timeSelect.innerHTML = '<option value="">Select Time</option>';

                // SYARAT BARU: Tarikh mesti ada. Barber OPTIONAL (boleh null).
                if (!date) {
                    return;
                }

                // Bina URL
                let url = `/api/available-times?date=${date}`;

                // Hanya append barberId jika user memilih barber
                if (barberId) {
                    url += `&barberId=${barberId}`;
                }

                // Hantar exclude ID jika ada
                if (appointmentId) {
                    url += `&excludeAppointmentId=${appointmentId}`;
                }

                fetch(url)
                    .then(response => response.json())
                    .then(times => {
                        times.forEach(time => {
                            // Filter out past times for today
                            const today = new Date().toISOString().split('T')[0];
                            if (date === today && isTimeInPast(date, time)) {
                                // Skip past times
                                return;
                            }
                            
                            const option = document.createElement('option');
                            option.value = time;
                            option.textContent = time;
                            timeSelect.appendChild(option);
                        });

                        // Auto-Select Logic (sama seperti sebelum ini)
                        const originalTime = document.getElementById('originalTime')?.value;
                        if (originalTime && Array.from(timeSelect.options).some(o => o.value === originalTime)) {
                            timeSelect.value = originalTime;
                        } else if (currentlySelectedTime && Array.from(timeSelect.options).some(o => o.value === currentlySelectedTime)) {
                            timeSelect.value = currentlySelectedTime;
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            }
        </script>
</body>

</html>
