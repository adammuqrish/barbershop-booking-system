<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hugi Barbershop System - Appointments</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">
    <div class="nk-app-root">
        <div class="nk-main">
            <div th:replace="~{fragments/adminFragments :: sidebar}"></div>
            <div class="nk-wrap">
                <div th:replace="~{fragments/adminFragments :: header}"></div>
                <div class="nk-content text-left">
                    <div class="container">
                        <div class="nk-block-head">
                            <h2 class="nk-block-title">Appointment List</h2>
                        </div>
                        <div class="nk-block">
                            <div class="card">
                                <table class="table">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Customer Name</th>
                                            <th>Day/Time</th>
                                            <th>Type</th>
                                            <th>Payment</th>
                                            <th>Service</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="a : ${appointmentList}">
                                            <td th:text="${a.customerName}"></td>
                                            <td th:text="${a.appointmentDate + ' ' + a.appointmentTime}"></td>
                                            <td th:text="${a.custType}"></td>
                                            <td>
                                                <span
                                                    th:if="${a.paymentStatus == 'completed' or a.paymentStatus == 'Completed'}"
                                                    class="badge bg-success">Completed</span>
                                                <button
                                                    th:if="${a.paymentStatus == 'pending' or a.paymentStatus == 'Pending'}"
                                                    class="btn btn-warning btn-sm">Pending</button>
                                            </td>
                                            <td>
                                                <span th:if="${a.serviceStatus == 'done' or a.serviceStatus == 'Done'}"
                                                    class="badge bg-success">Done</span>
                                                <span
                                                    th:if="${a.serviceStatus == 'cancelled' or a.serviceStatus == 'Cancelled'}"
                                                    class="badge bg-danger">Cancelled</span>
                                                <button
                                                    th:if="${a.serviceStatus == 'pending' or a.serviceStatus == 'Pending'}"
                                                    class="btn btn-warning btn-sm">Pending</button>
                                            </td>
                                            <td>
                                                <a th:href="@{/editAppointment(appointmentId=${a.appointmentId})}"
                                                    class="btn btn-sm btn-icon">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
