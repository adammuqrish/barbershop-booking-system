<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="${staffRole == 'BARBER' ? 'My Clients - Hugi Barbershop' : 'Customers - Hugi Barbershop'}">Customers - Hugi</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/theme.css}"/>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/fontawesome/css/all.min.css}"/>
</head>
<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">
<div class="nk-app-root"><div class="nk-main">
    <div th:replace="~{fragments/adminFragments :: sidebar}"></div>
    <div class="nk-wrap">
        <div th:replace="~{fragments/adminFragments :: header}"></div>
        <div class="nk-content">
            <div class="container-fluid">
                <div class="nk-block-head">
                    <div class="nk-block-between">
                        <div class="nk-block-head-content">
                            <h3 class="nk-block-title page-title" th:text="${staffRole == 'BARBER' ? 'My Clients' : 'Customers'}">Customers</h3>
                            <div class="nk-block-des text-soft"><p th:text="${staffRole == 'BARBER' ? 'Clients you have served — filtered to your appointments.' : 'All registered customers. Select a row to view details.'}">Subtitle</p></div>
                        </div>
                        <div class="nk-block-head-content">
                            <div class="search-wrap" style="min-width:240px">
                                <div class="search-content">
                                    <input type="text" id="customerSearch" class="form-control form-control-sm" placeholder="Search by name or phone…"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-gs">
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-inner-group">
                                <div class="card-inner p-0">
                                    <div class="table-responsive">
                                        <table class="table" id="customerTable">
                                            <thead>
                                                <tr class="nk-tb-head">
                                                    <th class="nk-tb-col" scope="col">Name</th>
                                                    <th class="nk-tb-col" scope="col">Phone</th>
                                                    <th class="nk-tb-col" scope="col">Loyalty</th>
                                                    <th class="nk-tb-col nk-tb-col-tools text-end" scope="col">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr th:each="cust : ${customerList}" class="nk-tb-item" th:classappend="${customer != null and customer.custId == cust.custId} ? 'table-active'">
                                                    <td class="nk-tb-col"><span class="tb-amount" th:text="${cust.custName}">Name</span></td>
                                                    <td class="nk-tb-col"><span class="tb-amount small" th:text="${cust.custPhoneNumber}">Phone</span></td>
                                                    <td class="nk-tb-col"><span class="badge badge-dot bg-light border text-dark" th:text="${cust.custLoyaltyPoints} + ' pts'" style="background:#fff; border-color:#e5e9f2; color:#364a63; font-weight:600;">0 pts</span></td>
                                                    <td class="nk-tb-col nk-tb-col-tools text-end">
                                                        <a th:if="${staffRole == 'ADMIN'}" th:href="@{/listCustomer(custId=${cust.custId})}" class="btn btn-sm btn-outline-light">View</a>
                                                        <a th:if="${staffRole == 'BARBER'}" th:href="@{/barber/customers(custId=${cust.custId})}" class="btn btn-sm btn-outline-light">View</a>
                                                    </td>
                                                </tr>
                                                <tr th:if="${customerList == null or #lists.isEmpty(customerList)}"><td colspan="4" class="text-center text-soft py-4">No customers found.</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div th:replace="~{fragments/adminComponents :: pagination(currentPage=${currentPage}, totalPages=${totalPages}, baseUrl=${staffRole == 'BARBER' ? '/barber/customers' : '/listCustomer'})}"></div>
                                </div>
                            </div>
                        </div>
                        <div class="text-soft small text-center mt-2" th:if="${customerPage != null}">Showing <span th:text="${customerPage.number * customerPage.size + 1}">1</span>–<span th:text="${customerPage.number * customerPage.size + #lists.size(customerList)}">10</span> of <span th:text="${customerPage.totalElements}">0</span></div>
                    </div>
                    <div class="col-lg-4">
                        <div th:if="${customer}" class="card">
                            <div class="card-inner">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h6 class="title mb-0">Customer Details</h6>
                                    <a th:href="${staffRole == 'BARBER' ? '/barber/customers' : '/listCustomer'}" class="btn btn-icon btn-sm btn-outline-light" title="Back to list" aria-label="Back to list"><em class="icon ni ni-cross"></em></a>
                                </div>
                                <div class="text-center">
                                    <div class="user-card">
                                        <div class="user-avatar lg mx-auto mb-2" style="width:88px;height:88px;font-size:28px; border:3px solid #fff; box-shadow:0 0 0 2px #e5e9f2; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:#1a1714;">
                                            <img th:if="${customer.custPicture != null}" th:src="@{'/resources/uploads/' + ${customer.custPicture}}" alt="Customer photo" style="width:100%;height:100%;object-fit:cover;"/>
                                            <span th:if="${customer.custPicture == null}" th:text="${customer.custName != null ? #strings.substring(customer.custName,0,1).toUpperCase() : '?'}" style="display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#c9a227;color:#1a1714;font-weight:700;font-family:'Manrope',sans-serif; font-size:32px;">A</span>
                                        </div>
                                        <div class="user-info">
                                            <span class="tb-lead" th:text="${customer.custName}">Name</span>
                                            <span class="tb-amount small text-soft" th:text="${customer.custEmail}">email</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <div class="row g-2">
                                        <div class="col-12"><div class="form-group"><label class="form-label">Phone</label><div class="form-control-wrap"><input class="form-control" th:value="${customer.custPhoneNumber}" readonly/></div></div></div>
                                        <div class="col-12"><div class="form-group"><label class="form-label">Loyalty Points</label><div class="form-control-wrap"><input class="form-control" th:value="${customer.custLoyaltyPoints}" readonly/></div></div></div>
                                        <div class="col-12"><div class="form-group"><label class="form-label">Email</label><div class="form-control-wrap"><input class="form-control" th:value="${customer.custEmail}" readonly/></div></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:if="${customer == null}" class="card">
                            <div class="card-inner text-center py-4">
                                <em class="icon ni ni-users" style="font-size:32px; opacity:.3"></em>
                                <p class="text-soft small mt-2">Select a customer to view details.</p>
                            </div>
                        </div>
                        <div th:if="${param.custId != null and customer == null}" class="alert alert-danger mt-3">Customer not found or not accessible.</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="nk-footer"><div class="container-fluid"><div class="nk-footer-wrap"><div class="nk-footer-copyright">© 2026 Hugi Barbershop.</div></div></div></div>
    </div>
</div></div>
<div th:replace="~{fragments/adminScripts :: adminJs}"></div>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    var input = document.getElementById('customerSearch');
    var table = document.getElementById('customerTable');
    if (!input || !table) return;
    input.addEventListener('input', function(){
      var q = this.value.toLowerCase();
      Array.from(table.tBodies[0].rows).forEach(function(tr){
        var text = tr.innerText.toLowerCase();
        tr.style.display = text.includes(q) ? '' : 'none';
      });
    });
  });
</script>
</body>
</html>
