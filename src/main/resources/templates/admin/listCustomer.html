<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hugi Barbershop System - Customers</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .nk-wrap {
            padding-top: 60px;
        }
    </style>
</head>

<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">
    <div class="nk-app-root">
        <div class="nk-main">
            <div th:replace="~{fragments/adminFragments :: sidebar}"></div>
            <div class="nk-wrap">
                <div th:replace="~{fragments/adminFragments :: header}"></div>
                <div class="nk-content">
                    <div class="container">
                        <div class="nk-block-head">
                            <h2 class="nk-block-title">Customers List</h2>
                        </div>
                        <div class="nk-block">
                            <div class="card">
                                <table class="table">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Name</th>
                                            <th>Phone Number</th>
                                            <th>Loyalty Points</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="cust : ${customerList}">
                                            <td th:text="${cust.custName}"></td>
                                            <td th:text="${cust.custPhoneNumber}"></td>
                                            <td th:text="${cust.custLoyaltyPoints}"></td>
                                            <td>
                                                <a th:href="@{/viewCustomerDetails(custId=${cust.custId})}"
                                                    class="btn btn-sm btn-primary">View</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
