<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">
    <div class="nk-app-root">
        <div class="nk-main">
            <div th:replace="~{fragments/adminFragments :: sidebar}"></div>
            <div class="nk-wrap">
                <div th:replace="~{fragments/adminFragments :: header}"></div>
                <div class="nk-content">
                    <div class="container-fluid">
                        <div class="nk-content-inner">
                            <div class="nk-content-body">
                                <div class="nk-block-head nk-block-head-sm">
                                    <div class="nk-block-between">
                                        <div class="nk-block-head-content">
                                            <h3 class="nk-block-title page-title">Admin Profile</h3>
                                            <div class="nk-block-des text-soft">
                                                <p>View and update your profile information.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="nk-block">
                                    <div class="card">
                                        <div class="card-aside-wrap">
                                            <div class="card-inner card-inner-lg">
                                                <div class="nk-block-head">
                                                    <div class="nk-block-between">
                                                        <div class="nk-block-head-content">
                                                            <h4 class="nk-block-title">Personal Information</h4>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="nk-block">
                                                    <form th:action="@{/admin/update-my-profile}" method="post" enctype="multipart/form-data">
                                                        <div class="row g-3">
                                                            <div class="col-md-6">
                                                                <div class="form-group">
                                                                    <label class="form-label" for="staffName">Name</label>
                                                                    <div class="form-control-wrap">
                                                                        <input type="text" class="form-control" id="staffName" name="staffName" th:value="${staff.staffName}" required>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <div class="form-group">
                                                                    <label class="form-label" for="staffEmail">Email</label>
                                                                    <div class="form-control-wrap">
                                                                        <input type="email" class="form-control" id="staffEmail" name="staffEmail" th:value="${staff.staffEmail}" required>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <div class="form-group">
                                                                    <label class="form-label" for="staffPhone">Phone Number</label>
                                                                    <div class="form-control-wrap">
                                                                        <input type="text" class="form-control" id="staffPhone" name="staffPhone" th:value="${staff.staffPhoneNumber}" required>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <div class="form-group">
                                                                    <label class="form-label" for="staffRole">Role</label>
                                                                    <div class="form-control-wrap">
                                                                        <input type="text" class="form-control" id="staffRole" name="staffRole" th:value="${staff.staffRole}" readonly>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-md-12">
                                                                <div class="form-group">
                                                                    <label class="form-label" for="description">Description</label>
                                                                    <div class="form-control-wrap">
                                                                        <textarea class="form-control" id="description" name="description" rows="3" th:text="${staff.description}"></textarea>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <div class="form-group">
                                                                    <label class="form-label" for="staffPicture">Profile Picture</label>
                                                                    <div class="form-control-wrap">
                                                                        <input type="file" class="form-control" id="staffPicture" name="staffPicture" accept="image/*">
                                                                        <small class="form-text text-muted">Leave empty to keep current picture.</small>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="col-12">
                                                                <div class="form-group">
                                                                    <button type="submit" class="btn btn-primary">Update Profile</button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/resources/assetsAdmin/js/bundle.js}"></script>
    <script th:src="@{/resources/assetsAdmin/js/scripts.js}"></script>
    <script th:src="@{/resources/assetsAdmin/js/demo-init.js}"></script>
</body>
</html>
