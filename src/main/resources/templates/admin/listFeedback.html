<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="${staffRole == 'BARBER' ? 'Feedback About Me - Hugi Barbershop' : 'Feedback - Hugi Barbershop'}">Feedback - Hugi</title>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/theme.css}"/>
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/fontawesome/css/all.min.css}"/>
</head>
<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">
<div class="nk-app-root"><div class="nk-main">
    <div th:replace="~{fragments/adminFragments :: sidebar}"></div>
    <div class="nk-wrap">
        <div th:replace="~{fragments/adminFragments :: header}"></div>
        <div class="nk-content"><div class="container-fluid">
            <div class="nk-block-head">
                <div class="nk-block-between">
                    <div class="nk-block-head-content">
                        <h3 class="nk-block-title page-title" th:text="${staffRole == 'BARBER' ? 'Feedback About Me' : 'Feedback'}">Feedback</h3>
                        <div class="nk-block-des text-soft"><p th:text="${staffRole == 'BARBER' ? 'Ratings and comments from your clients.' : 'All customer feedback — filter by rating.'}">Subtitle</p></div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-inner-group">
                    <div class="card-inner position-relative">
                        <div class="card-title-group">
                            <div class="card-tools">
                                <div class="form-inline flex-nowrap gx-2">
                                    <select id="ratingFilter" class="form-select form-select-sm" style="width:160px">
                                        <option value="">All ratings</option>
                                        <option value="5">★★★★★ (5)</option>
                                        <option value="4">★★★★ (4+)</option>
                                        <option value="3">★★★ (3+)</option>
                                        <option value="1">1–2 stars</option>
                                    </select>
                                    <input type="text" id="fbSearch" class="form-control form-control-sm" placeholder="Search comments…" style="width:200px"/>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-inner p-0">
                        <div class="table-responsive">
                            <table class="table" id="feedbackTable">
                                <thead><tr class="nk-tb-head">
                                    <th class="nk-tb-col">Customer</th>
                                    <th class="nk-tb-col">Rating</th>
                                    <th class="nk-tb-col" style="min-width:280px">Comments</th>
                                    <th class="nk-tb-col">Appointment</th>
                                </tr></thead>
                                <tbody>
                                    <tr th:each="feedback : ${feedbackList}" class="nk-tb-item" th:data-rating="${feedback.rating}">
                                        <td class="nk-tb-col"><span class="tb-lead" th:text="${feedback.customerName}">Name</span></td>
                                        <td class="nk-tb-col">
                                            <span class="text-warning" th:with="r=${feedback.rating}">
                                                <span th:each="i : ${#numbers.sequence(1,5)}"><em th:class="${i <= r} ? 'icon ni ni-star-fill' : 'icon ni ni-star'" style="font-size:13px"></em></span>
                                                <span class="small text-soft ms-1" th:text="'(' + ${feedback.rating} + ')'">(5)</span>
                                            </span>
                                        </td>
                                        <td class="nk-tb-col"><span class="small" th:text="${feedback.comments}" style="display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:520px">Comments</span></td>
                                        <td class="nk-tb-col"><span class="badge bg-outline-gray" th:text="'#' + ${feedback.appointmentId}">#1</span></td>
                                    </tr>
                                    <tr th:if="${feedbackList == null or #lists.isEmpty(feedbackList)}"><td colspan="4" class="text-center text-soft py-4">No feedback yet.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div></div>
        <div class="nk-footer"><div class="container-fluid"><div class="nk-footer-wrap"><div class="nk-footer-copyright">© 2026 Hugi Barbershop.</div></div></div></div>
    </div>
</div></div>
<div th:replace="~{fragments/adminScripts :: adminJs}"></div>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    var sel=document.getElementById('ratingFilter'), input=document.getElementById('fbSearch'), table=document.getElementById('feedbackTable');
    function filter(){
      var r=sel ? sel.value : '', q=input ? input.value.toLowerCase() : '';
      Array.from(table.tBodies[0].rows).forEach(function(tr){
        if(tr.cells.length < 4) return;
        var rating=tr.getAttribute('data-rating')||'', text=tr.innerText.toLowerCase();
        var okRating=true;
        if(r==='5') okRating=rating==='5';
        else if(r==='4') okRating=parseInt(rating||0)>=4;
        else if(r==='3') okRating=parseInt(rating||0)>=3;
        else if(r==='1') okRating=parseInt(rating||0)<=2;
        var okSearch=!q || text.includes(q);
        tr.style.display=(okRating && okSearch)?'':'none';
      });
    }
    if(sel) sel.addEventListener('change', filter);
    if(input) input.addEventListener('input', filter);
  });
</script>
</body>
</html>
