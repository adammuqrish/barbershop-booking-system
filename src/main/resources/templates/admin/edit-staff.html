<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Staff</title>

    <!-- Main Admin CSS -->
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/fontawesome/css/all.min.css}">
</head>

<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">

    <div class="nk-app-root">
        <div class="nk-main">

            <!-- Sidebar -->
            <div th:replace="~{fragments/adminFragments :: sidebar}"></div>

            <div class="nk-wrap">

                <!-- Header -->
                <div th:replace="~{fragments/adminFragments :: header}"></div>

                <!-- Content -->
                <div class="nk-content">
                    <div class="container">

                        <!-- Page Header -->
                        <div class="nk-block-head">
                            <div class="nk-block-head-content">
                                <h3 class="nk-block-title">
                                    <i class="fas fa-user-edit me-2"></i>Edit Staff
                                </h3>
                                <p class="nk-block-subtitle">
                                    Update barber or admin information
                                </p>
                            </div>
                        </div>

                        <!-- Error Alert -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <strong>Error:</strong> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Form Card (Only show if staff exists) -->
                        <div th:if="${staff}" class="nk-block">
                            <div class="card">
                                <div class="card-inner">

                                    <form th:action="@{/admin/update-staff}" method="post">

                                        <input type="hidden" name="staffId" th:value="${staff.staffId}" />

                                        <div class="row g-4">

                                            <!-- Name -->
                                            <div class="col-md-6">
                                                <label class="form-label">Full Name</label>
                                                <input type="text" name="name" class="form-control"
                                                    th:value="${staff.staffName}" required>
                                            </div>

                                            <!-- Email -->
                                            <div class="col-md-6">
                                                <label class="form-label">Email Address</label>
                                                <input type="email" name="email" class="form-control"
                                                    th:value="${staff.staffEmail}" required>
                                            </div>

                                            <!-- Phone -->
                                            <div class="col-md-6">
                                                <label class="form-label">Phone Number</label>
                                                <input type="text" name="phone" class="form-control"
                                                    th:value="${staff.staffPhoneNumber}" required>
                                            </div>

                                            <!-- Role (Disabled - Display Only) -->
                                            <div class="col-md-6">
                                                <label class="form-label">Role</label>
                                                <input type="text" class="form-control" disabled
                                                    th:value="${staff.staffRole == 'ADMIN' ? 'Administrator' : 'Barber'}">
                                                <!-- Hidden input to submit the role value -->
                                                <input type="hidden" name="role" th:value="${staff.staffRole}">
                                                <small class="form-text text-muted d-block mt-1">
                                                    <i class="fas fa-lock me-1"></i>Role cannot be changed
                                                </small>
                                            </div>

                                            <!-- Description -->
                                            <div class="col-12">
                                                <label class="form-label">Description (Optional)</label>
                                                <textarea name="description" class="form-control" rows="4"
                                                    placeholder="Add any additional information about this staff member..."
                                                    th:inline="text">${staff.description}</textarea>
                                            </div>

                                        </div>

                                        <!-- Buttons -->
                                        <div class="mt-5 d-flex justify-content-end gap-2 border-top pt-4">
                                            <a th:href="@{/listBarber}" class="btn btn-light">
                                                <i class="fas fa-times me-2"></i>Cancel
                                            </a>

                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-save me-2"></i>Save Changes
                                            </button>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>

                        <!-- No Staff Message -->
                        <div th:if="${!staff}" class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            <a th:href="@{/listBarber}" class="alert-link">Go back to staff list</a> to select a staff
                            member to edit.
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div th:replace="~{fragments/adminScripts :: adminJs}"></div>

</body>

</html>
