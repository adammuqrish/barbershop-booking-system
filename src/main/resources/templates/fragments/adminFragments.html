<div
  th:fragment="sidebar"
  id="sidebar"
  class="nk-sidebar nk-sidebar-fixed is-theme"
>
  <div class="nk-sidebar-element nk-sidebar-head">
    <div class="nk-sidebar-brand">
      <a th:href="@{/adminIndex}" class="logo-link">
        <div class="logo-wrap" style="width: 150px; height: 100px">
          <img
            class="logo-img logo-light"
            th:src="@{/resources/uploads/hugiBarber1.png}"
            style="width: 150px; height: 100px"
          />
        </div>
      </a>
    </div>
  </div>
  <div class="nk-sidebar-element nk-sidebar-body">
    <div class="nk-sidebar-content">
      <div class="nk-sidebar-menu">
        <ul class="nk-menu">
          <li class="nk-menu-heading">
            <h6 class="overline-title">Hugi Barbershop</h6>
          </li>
          <li class="nk-menu-item">
            <a th:href="@{/listCustomer}" class="nk-menu-link">Customer</a>
          </li>
          <li class="nk-menu-item">
            <a th:href="@{/listBarber}" class="nk-menu-link">Barber</a>
          </li>
          <li class="nk-menu-item">
            <a th:href="@{/listAppointment}" class="nk-menu-link"
              >Appointment</a
            >
          </li>
          <li th:if="${staffRole == 'ADMIN'}" class="nk-menu-item">
            <a th:href="@{/admin/list-transactions}" class="nk-menu-link"
              >Transaction</a
            >
          </li>
          <li class="nk-menu-item">
            <a th:href="@{/admin/list-feedback}" class="nk-menu-link"
              >Feedback</a
            >
          </li>
          <li class="nk-menu-item">
            <a th:href="@{/logout}" class="nk-menu-link">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div th:fragment="header" class="nk-header nk-header-fixed">
  <div class="container-fluid">
    <div class="nk-header-wrap" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="nk-header-brand d-xl-none">
        <a th:href="@{/adminIndex}" class="logo-link">Hugi Barbershop</a>
      </div>
      <div style="flex: 1;"></div>
      <div class="nk-header-tools">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 20px;">
          <a th:href="@{/admin/profile}" class="text-decoration-none">
            <span th:text="${staffName}" style="font-weight: 500; color: #333; font-size: 14px;"></span>
          </a>
          <div class="user-avatar sm">
            <a th:href="@{/admin/profile}">
              <img th:if="${staff != null && staff.staffPicture != null}" th:src="@{'/resources/uploads/' + ${staff.staffPicture}}" alt="Admin Avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
              <em th:unless="${staff != null && staff.staffPicture != null}" class="icon ni ni-user-alt"></em>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
