<div th:fragment="sidebar" id="sidebar" class="nk-sidebar nk-sidebar-fixed is-theme">
  <div class="nk-sidebar-element nk-sidebar-head">
    <div class="nk-sidebar-brand">
      <a th:href="${staffRole == 'ADMIN' ? '/adminIndex' : '/barber/dashboard'}" class="logo-link" aria-label="Dashboard">
        <div class="logo-wrap">
          <img class="logo-img logo-light" th:src="@{/resources/uploads/hugiBarber1.png}" alt="Hugi Barbershop"/>
        </div>
      </a>
    </div>
  </div>
  <div class="nk-sidebar-element nk-sidebar-body">
    <div class="nk-sidebar-content">
      <div class="nk-sidebar-menu">
        <ul class="nk-menu">
          <li class="nk-menu-heading">
            <h6 class="overline-title">Hugi Barbershop</h6>
            <span th:if="${staffRole == 'BARBER'}" class="d-block text-soft small mt-1" style="color:rgba(255,255,255,.55)">Barber — your data only</span>
          </li>

          <li class="nk-menu-item" th:classappend="${#httpServletRequest != null and (#strings.contains(#httpServletRequest.requestURI,'adminIndex') or #strings.contains(#httpServletRequest.requestURI,'barber/dashboard'))} ? 'active'">
            <a th:href="${staffRole == 'ADMIN' ? '/adminIndex' : '/barber/dashboard'}" class="nk-menu-link">
              <em class="icon ni ni-dashboard nki"></em><span>Dashboard</span>
            </a>
          </li>

          <li class="nk-menu-heading"><h6 class="overline-title">Manage</h6></li>

          <li class="nk-menu-item" th:classappend="${#httpServletRequest != null and (#strings.contains(#httpServletRequest.requestURI,'listCustomer') or #strings.contains(#httpServletRequest.requestURI,'barber/customers'))} ? 'active'">
            <a th:href="${staffRole == 'ADMIN' ? '/listCustomer' : '/barber/customers'}" class="nk-menu-link">
              <em class="icon ni ni-users nki"></em><span>Customers</span>
              <span th:if="${staffRole == 'BARBER'}" class="badge bg-outline-light ms-auto" style="font-size:.65rem">My clients</span>
            </a>
          </li>

          <li th:if="${staffRole == 'ADMIN'}" class="nk-menu-item" th:classappend="${#httpServletRequest != null and #strings.contains(#httpServletRequest.requestURI,'listBarber')} ? 'active'">
            <a th:href="@{/listBarber}" class="nk-menu-link"><em class="icon ni ni-users-alt nki"></em><span>Staff</span></a>
          </li>

          <li class="nk-menu-item" th:classappend="${#httpServletRequest != null and (#strings.contains(#httpServletRequest.requestURI,'listAppointment') or #strings.contains(#httpServletRequest.requestURI,'barber/appointments'))} ? 'active'">
            <a th:href="${staffRole == 'ADMIN' ? '/listAppointment' : '/barber/appointments'}" class="nk-menu-link">
              <em class="icon ni ni-calendar nki"></em><span>Appointments</span>
              <span th:if="${staffRole == 'BARBER'}" class="badge bg-outline-light ms-auto" style="font-size:.65rem">My schedule</span>
            </a>
          </li>

          <li class="nk-menu-heading"><h6 class="overline-title">Finance & Feedback</h6></li>

          <li class="nk-menu-item" th:classappend="${#httpServletRequest != null and (#strings.contains(#httpServletRequest.requestURI,'list-transactions') or #strings.contains(#httpServletRequest.requestURI,'barber/transactions'))} ? 'active'">
            <a th:href="${staffRole == 'ADMIN' ? '/admin/list-transactions' : '/barber/transactions'}" class="nk-menu-link">
              <em class="icon ni ni-activity nki"></em><span>Transactions</span>
              <span th:if="${staffRole == 'BARBER'}" class="badge bg-outline-light ms-auto" style="font-size:.65rem">Mine</span>
            </a>
          </li>

          <li class="nk-menu-item" th:classappend="${#httpServletRequest != null and (#strings.contains(#httpServletRequest.requestURI,'list-feedback') or #strings.contains(#httpServletRequest.requestURI,'barber/feedbacks'))} ? 'active'">
            <a th:href="${staffRole == 'ADMIN' ? '/admin/list-feedback' : '/barber/feedbacks'}" class="nk-menu-link">
              <em class="icon ni ni-star nki"></em><span>Feedback</span>
              <span th:if="${staffRole == 'BARBER'}" class="badge bg-outline-light ms-auto" style="font-size:.65rem">About me</span>
            </a>
          </li>

          <li class="nk-menu-item mt-3">
            <form th:action="@{/logout}" method="post" class="d-inline w-100">
              <button type="submit" class="nk-menu-link bg-transparent border-0 w-100 text-start"><em class="icon ni ni-signout nki"></em><span>Logout</span></button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<div th:fragment="header" class="nk-header nk-header-fixed">
  <div class="container-fluid">
    <div class="nk-header-wrap">
      <div class="nk-header-brand d-xl-none">
        <a href="#" class="nk-menu-trigger nk-header-menu-trigger me-2" data-target="sidebar" aria-label="Toggle sidebar">
          <em class="icon ni ni-menu"></em>
        </a>
        <a th:href="${staffRole == 'ADMIN' ? '/adminIndex' : '/barber/dashboard'}" class="logo-link">Hugi Barbershop</a>
      </div>
      <div class="nk-header-tools">
        <ul class="nk-quick-nav" style="display:flex; align-items:center; gap:12px; list-style:none; margin:0;">
          <li th:if="${staffRole == 'BARBER'}" class="d-none d-md-block">
            <span class="badge bg-light text-dark border" style="font-weight:500"><em class="icon ni ni-info me-1"></em>Viewing your data only</span>
          </li>
          <li>
            <a th:href="${staffRole == 'ADMIN' ? '/admin/profile' : '/barber/profile'}" class="d-flex align-items-center gap-2 text-decoration-none">
              <span class="d-none d-sm-inline" th:text="${staffName}" style="font-weight:600; color:#364a63; font-size:13px;"></span>
              <span class="badge bg-outline-gray d-sm-none" th:text="${staffRole}" style="font-size:.65rem"></span>
              <span class="user-avatar sm" style="width:36px; height:36px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:#eef2f7;">
                <img th:if="${staff != null && staff.staffPicture != null}" th:src="@{'/resources/uploads/' + ${staff.staffPicture}}" alt="Staff avatar" style="width:100%; height:100%; object-fit:cover;"/>
                <em th:unless="${staff != null && staff.staffPicture != null}" class="icon ni ni-user-alt" style="font-size:18px; color:#526484;"></em>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
</div>
