<nav xmlns:th="http://www.thymeleaf.org" th:fragment="nav" class="hb-nav">
    <div class="hb-nav-inner">
        <a class="hb-brand" th:href="@{/index}">
            <span class="hb-brand-mark">H</span>
            <span class="hb-brand-name">Hugi<em>.</em></span>
        </a>
        <ul class="hb-nav-links">
            <li><a th:href="@{/index#aboutUs}">About</a></li>
            <li><a th:href="@{/index#services}">Services &amp; Prices</a></li>
            <li><a th:href="@{/index#barbers}">Barbers</a></li>
            <li><a th:href="@{/index#visit}">Visit Us</a></li>

            <!-- Logged-in customer -->
            <th:block th:if="${session.customer != null}">
                <li>
                    <a th:href="@{/profile}" style="display:inline-flex;align-items:center;gap:8px">
                        <img th:if="${session.customer.custPicture != null}"
                             th:src="@{'/resources/uploads/' + ${session.customer.custPicture}}"
                             alt="Profile picture"
                             style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--brass)" />
                        <th:block th:unless="${session.customer.custPicture != null}">
                            <svg width="22" height="22" viewBox="0 0 20 20" fill="var(--brass)" aria-hidden="true">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                      clip-rule="evenodd"></path>
                            </svg>
                        </th:block>
                        <th:block th:text="${session.customer.custName}">Name</th:block>
                    </a>
                </li>
                <li class="hb-nav-cta">
                    <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
                        <button type="submit" class="hb-btn hb-btn-outline" style="font-size:16px;padding:6px 18px">Logout</button>
                    </form>
                </li>
            </th:block>

            <!-- Guest -->
            <th:block th:unless="${session.customer != null}">
                <li><a th:href="@{/register#login}">Login</a></li>
                <li class="hb-nav-cta"><a class="hb-btn hb-btn-brass" th:href="@{/booking}">Book Now</a></li>
            </th:block>
        </ul>
    </div>
</nav>
