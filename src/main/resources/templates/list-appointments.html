<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Senarai Tempahan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="max-w-6xl mx-auto mt-10 bg-white shadow-lg rounded-lg p-6">
    <h1 class="text-3xl font-bold mb-6 text-center">Senarai Tempahan</h1>

    <table class="min-w-full border border-gray-300">
      <thead>
        <tr class="bg-gray-200 text-gray-700">
          <th class="px-4 py-2">ID</th>
          <th class="px-4 py-2">Customer ID</th>
          <th class="px-4 py-2">Staff ID</th>
          <th class="px-4 py-2">Tarikh</th>
          <th class="px-4 py-2">Masa</th>
          <th class="px-4 py-2">Status</th>
          <th class="px-4 py-2">Tindakan</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="appt : ${appointments}" class="border-t">
          <td class="px-4 py-2" th:text="${appt.appointmentId}"></td>
          <td class="px-4 py-2" th:text="${appt.customerId}"></td>
          <td class="px-4 py-2" th:text="${appt.staffId}"></td>
          <td class="px-4 py-2" th:text="${appt.appointmentDate}"></td>
          <td class="px-4 py-2" th:text="${appt.appointmentTime}"></td>
          <td class="px-4 py-2" th:text="${appt.serviceStatus}"></td>
          <td class="px-4 py-2 text-center">
            <a th:href="@{'/edit-booking/' + ${appt.appointmentId}}" 
               class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">Edit</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
