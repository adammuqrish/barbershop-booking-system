<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-20 flex-grow">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-5xl mx-auto">
            <h1 class="text-2xl font-bold mb-4">Profile Management</h1>
            <!-- ✅ ALERT ERROR (Tailwind CSS) -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
                <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer"
                    onclick="this.parentElement.style.display='none';">
                    <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20">
                        <title>Close</title>
                        <path
                            d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1-1.697 1.697z" />
                    </svg>
                </span>
            </div>
            <form th:action="@{/update-profile}" method="post" enctype="multipart/form-data">
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="name">Name:</label>
                    <input type="text" id="name" name="name" th:value="${customer.custName}"
                        class="w-full p-2 border rounded" required />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="email">Email:</label>
                    <input type="email" id="email" name="email" th:value="${customer.custEmail}"
                        class="w-full p-2 border rounded" required />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone" th:value="${customer.custPhoneNumber}"
                        class="w-full p-2 border rounded" required />
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="image">Profile Picture:</label>
                    <div class="flex items-center justify-between w-full p-2 border rounded bg-white">
                        <label for="image"
                            class="cursor-pointer bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-600 transition text-sm">
                            Choose File
                        </label>
                        <span id="fileNameDisplay" class="text-gray-500 text-sm bg-gray-100 px-3 py-1 rounded border">No
                            file chosen</span>
                        <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/jpg"
                            class="hidden"
                            onchange="document.getElementById('fileNameDisplay').innerText = this.files[0] ? this.files[0].name : 'No file chosen'" />
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1" for="password">New Password (leave blank to keep
                        current):</label>
                    <input type="password" id="password" name="password" class="w-full p-2 border rounded" />
                </div>
                <div class="flex space-x-2">
                    <button type="submit"
                        class="bg-green-500 text-white rounded py-2 px-4 flex-1 hover:bg-green-600 transition">Save
                        Changes</button>
                    <a th:href="@{/profile}"
                        class="bg-gray-300 text-black text-center px-4 py-2 rounded flex-1 hover:bg-gray-400">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
