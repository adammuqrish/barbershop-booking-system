<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}">
    <title>Edit Profile — Hugi Barbershop</title>
</head>

<body class="flex flex-col min-h-screen" style="font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);margin:0">
<style>
    .ep-wrap{width:100%;max-width:640px;margin:0 auto;padding:40px 24px 72px}
    .ep-title{font-family:'Bebas Neue';font-size:42px;line-height:1.05;letter-spacing:.03em;margin:0 0 6px;color:#1c1a17}
    .ep-sub{color:#9a938a;margin:0 0 26px;font-size:.95rem}
    .ep-card{background:#fff;border:2px solid var(--line,#e2d9c8);border-radius:6px;padding:30px}
    .ep-label{display:block;font-weight:600;font-size:.88rem;margin:20px 0 7px;color:#1c1a17}
    .ep-label:first-child{margin-top:0}
    .ep-input{width:100%;padding:12px 14px;border:2px solid var(--line,#e2d9c8);border-radius:5px;background:#fff;font-size:.95rem;transition:border-color .15s ease}
    .ep-input:focus{outline:none;border-color:var(--brass,#b08d57)}
    .ep-file-row{display:flex;align-items:center;gap:12px}
    .ep-file-btn{display:inline-block;background:var(--ink,#1c1a17);color:var(--brass,#b08d57);padding:10px 18px;border-radius:5px;font-size:.85rem;font-weight:700;cursor:pointer}
    .ep-file-btn:hover{filter:brightness(1.15)}
    .ep-file-name{flex:1;padding:9px 13px;border:1px dashed var(--line,#e2d9c8);border-radius:5px;color:#9a938a;font-size:.85rem;background:#fdfaf3}
    .ep-hint{font-size:.78rem;color:#9a938a;margin-top:5px}
    .ep-pw-wrap{position:relative}
    .ep-pw-wrap .ep-input{padding-right:44px}
    .ep-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:8px;color:#9a938a;display:flex}
    .ep-toggle:hover{color:#1c1a17}
    .ep-actions{display:flex;gap:12px;margin-top:30px}
    .ep-save{flex:1;background:var(--oxblood,#7d1f2e);color:#fff;border:none;border-radius:5px;padding:14px;font-family:'Bebas Neue';font-size:21px;letter-spacing:.09em;cursor:pointer;transition:filter .15s ease}
    .ep-save:hover{filter:brightness(1.12)}
    .ep-cancel{flex:1;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#7a736a;border:2px solid var(--line,#e2d9c8);border-radius:5px;text-decoration:none;font-weight:700;font-size:.92rem}
    .ep-cancel:hover{border-color:#b3122f;color:#b3122f}
    .ep-error{background:#fdeaea;border-left:4px solid #b3122f;color:#b3122f;padding:11px 15px;border-radius:0 4px 4px 0;font-weight:600;font-size:.92rem;margin-bottom:22px}
</style>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main style="flex:1">
    <div class="ep-wrap">
        <h1 class="ep-title">Edit profile</h1>
        <p class="ep-sub">Update your details, photo, or password.</p>

        <div th:if="${error}" class="ep-error" role="alert">
            ⚠ <span th:text="${error}"></span>
        </div>

        <div class="ep-card">
            <form th:action="@{/update-profile}" method="post" enctype="multipart/form-data">
                <label class="ep-label" for="name">Name:</label>
                <input type="text" id="name" name="name" th:value="${customer.custName}"
                    class="ep-input" required />

                <label class="ep-label" for="email">Email:</label>
                <input type="email" id="email" name="email" th:value="${customer.custEmail}"
                    class="ep-input" required />

                <label class="ep-label" for="phone">Phone number:</label>
                <input type="text" id="phone" name="phone" th:value="${customer.custPhoneNumber}"
                    class="ep-input" required />

                <label class="ep-label" for="image">Profile picture:</label>
                <div class="ep-file-row">
                    <label for="image" class="ep-file-btn">Choose file</label>
                    <span id="fileNameDisplay" class="ep-file-name">No file chosen</span>
                    <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/jpg"
                        class="hidden"
                        onchange="document.getElementById('fileNameDisplay').innerText = this.files[0] ? this.files[0].name : 'No file chosen'" />
                </div>
                <p class="ep-hint">PNG or JPG. Your photo shows in the navbar and on your profile.</p>

                <label class="ep-label" for="password">New password <span style="font-weight:400;color:#9a938a">(leave blank to keep current)</span>:</label>
                <div class="ep-pw-wrap">
                    <input type="password" id="password" name="password" class="ep-input" />
                    <button type="button" data-target="password"
                        class="password-toggle ep-toggle"
                        aria-label="Show password">
                        <svg class="eye-icon w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="19" height="19">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg class="eye-off-icon w-5 h-5 hidden" fill="none" stroke="currentColor"
                            stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true" width="19" height="19">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>

                <div class="ep-actions">
                    <a th:href="@{/profile}" class="ep-cancel">Cancel</a>
                    <button type="submit" class="ep-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    // Password visibility toggle
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.password-toggle').forEach(function (button) {
            button.addEventListener('click', function () {
                var input = document.getElementById(button.getAttribute('data-target'));
                if (!input) return;

                var isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';

                var eyeIcon = button.querySelector('.eye-icon');
                var eyeOffIcon = button.querySelector('.eye-off-icon');
                if (eyeIcon) eyeIcon.classList.toggle('hidden', !isPassword);
                if (eyeOffIcon) eyeOffIcon.classList.toggle('hidden', isPassword);

                button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });
        });
    });
</script>
</body>

</html>
