<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Appointment</title>

    <link rel="stylesheet" th:href="@{/resources/assetsAdmin/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="nk-body" data-sidebar-collapse="lg" data-navbar-collapse="lg">

    <div class="nk-app-root">
        <div class="nk-main">

            <!-- Sidebar -->
            <div th:replace="~{fragments/adminFragments :: sidebar}"></div>

            <div class="nk-wrap">

                <!-- Header -->
                <div th:replace="~{fragments/adminFragments :: header}"></div>

                <!-- Content -->
                <div class="nk-content">
                    <div class="container text-left">

                        <!-- Page Title -->
                        <div class="nk-block-head">
                            <div class="nk-block-head-content">
                                <h2 class="nk-block-title">
                                    <i class="fas fa-calendar-check me-2"></i>
                                    Edit Appointment
                                </h2>
                            </div>
                        </div>

                        <!-- Alert Error (TAMBAHAN) -->
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- Form Card -->
                        <div class="nk-block">
                            <div class="card">
                                <div class="card-inner">

                                    <form th:action="@{/admin/update-appointment}" method="post">

                                        <input type="hidden" name="appointmentId"
                                            th:value="${appointment.appointmentId}" />

                                        <div class="row g-4">

                                            <!-- Booking For -->
                                            <div class="col-md-6">
                                                <label class="form-label">Booking For</label>
                                                <input type="text" class="form-control"
                                                    th:value="${appointment.customerName}" readonly>
                                            </div>

                                            <!-- Customer Category -->
                                            <div class="col-md-6">
                                                <label class="form-label">Customer Category</label>
                                                <select name="custType" class="form-select" required>
                                                    <option value="Adult"
                                                        th:selected="${appointment.custType == 'Adult'}">
                                                        Adult
                                                    </option>
                                                    <option value="Kids"
                                                        th:selected="${appointment.custType == 'Kids'}">
                                                        Kids
                                                    </option>
                                                </select>
                                            </div>

                                            <!-- Appointment Date -->
                                            <div class="col-md-6">
                                                <label class="form-label">Appointment Date</label>
                                                <input type="date" id="appointmentDate" name="appointmentDate"
                                                    class="form-control" th:value="${appointment.appointmentDate}"
                                                    required>
                                            </div>

                                            <!-- Appointment Time -->
                                            <div class="col-md-6">
                                                <label class="form-label">Appointment Time</label>
                                                <input type="time" id="appointmentTime" name="appointmentTime"
                                                    class="form-control" th:value="${appointment.appointmentTime}"
                                                    required>
                                            </div>

                                            <!-- Select Barber -->
                                            <div class="col-12">
                                                <label class="form-label">Select Barber</label>
                                                <select name="staffId" id="barberSelect" class="form-select" required>
                                                    <option value="">-- Select Barber --</option>
                                                    <option th:each="b : ${barberList}" th:value="${b.staffId}"
                                                        th:text="${b.staffName}"
                                                        th:selected="${b.staffId == appointment.staffId}"
                                                        data-id="${b.staffId}"> <!-- Tambah data-id untuk JS -->
                                                    </option>
                                                </select>
                                            </div>

                                        </div>

                                        <!-- Buttons -->
                                        <div class="mt-4 d-flex justify-content-end gap-2">
                                            <a th:href="@{/listAppointment}" class="btn btn-light">
                                                Cancel
                                            </a>

                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-save me-1"></i>
                                                Update Appointment
                                            </button>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- TAMBAHAN JAVASCRIPT UNTUK CHECK BARBER CLASH -->
    <script th:inline="javascript">
        // 1. Tangkap data dari server
        const unavailableBarbersBySlot = /*[[${unavailableBarbersBySlot}]]*/ {};
        const currentAppointmentId = /*[[${appointment.appointmentId}]]*/ 0;
        const currentBarberId = /*[[${appointment.staffId}]]*/ 0;
        const originalDate = /*[[${appointment.appointmentDate}]]*/ '';

        // Function untuk check availability dan update dropdown
        function updateBarberAvailability(selectedDate, selectedTime) {
            const barberSelect = document.getElementById('barberSelect');

            if (!selectedDate || !selectedTime) return; // Jika belum pilih, biarkan semua

            // Tukar format time (HH:mm) kepada slot format (HH:mm am/pm) untuk cari dalam map
            // Contoh: 14:00 -> "02:00 pm"
            let slotKey = "";
            let [h, m] = selectedTime.split(':');
            let hour = parseInt(h);
            let ampm = hour >= 12 ? 'pm' : 'am';
            hour = hour % 12;
            hour = hour ? hour : 12; // the hour '0' should be '12'
            slotKey = hour + ':' + m + ' ' + ampm;

            // Dapatkan senarai barber yang tak available untuk slot tersebut
            const unavailableList = unavailableBarbersBySlot[slotKey] || [];

            // Loop setiap option dalam dropdown
            Array.from(barberSelect.options).forEach(opt => {
                if (opt.value === "") return; // Skip default option

                const barberId = parseInt(opt.getAttribute('data-id'));

                // Logic: Adakah barber ini unavailable?
                let isUnavailable = unavailableList.includes(barberId);

                // Exception: Jika ini adalah booking asal (Barber sama, Date sama, Time sama), ia allowed.
                // Perhatian: slotKey mungkin tak sama 100% jika format berubah, jadi kita bandingkan ID Barber dan Date
                const isMyOriginalBooking = (barberId === currentBarberId && selectedDate === originalDate);

                if (isMyOriginalBooking) {
                    isUnavailable = false;
                }

                // Sembunyikan (display:none) jika unavailable
                if (isUnavailable) {
                    opt.style.display = 'none';
                    opt.disabled = true;

                    // Jika user sedang memilih barber ini tapi tiba-tiba dia jadi unavailable, reset selection
                    if (barberSelect.value === opt.value.toString()) {
                        barberSelect.value = "";
                    }
                } else {
                    opt.style.display = '';
                    opt.disabled = false;
                }
            });
        }

        // Event Listener: Bila user tukar Date
        document.getElementById('appointmentDate').addEventListener('change', function () {
            const dateVal = this.value;
            const timeVal = document.getElementById('appointmentTime').value;

            // Jika tukar date, kita perlu fetch data baru untuk tarikh tersebut
            if (dateVal) {
                // Panggil endpoint admin (atau buat endpoint baru) untuk dapatkan data fresh
                // Untuk admin, endpoint mungkin belum ada. Kita boleh guna logic simple:
                // Reload page dengan parameter baru? Atau buat endpoint API.

                // SEKARANG: Kita guna logik simple.
                // Jika user tukar tarikh, kita reset barber dropdown dulu sementara 
                // (sehingga user tukar masa dan kita boleh check).
                // ATAU lebih baik: Tidak check kecuali masa dipilih.
                // Biarkan update dipanggil bila masa tukar.
                updateBarberAvailability(dateVal, timeVal);
            }
        });

        // Event Listener: Bila user tukar Time
        document.getElementById('appointmentTime').addEventListener('change', function () {
            const dateVal = document.getElementById('appointmentDate').value;
            const timeVal = this.value;
            updateBarberAvailability(dateVal, timeVal);
        });

        // Run check pada load awal page (jika date & time dah ada)
        window.addEventListener('DOMContentLoaded', () => {
            const dateVal = document.getElementById('appointmentDate').value;
            const timeVal = document.getElementById('appointmentTime').value;
            if (dateVal && timeVal) {
                updateBarberAvailability(dateVal, timeVal);
            }
        });

    </script>
</body>

</html>
