<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-12 flex-grow">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-5xl mx-auto">
            <h1 class="text-3xl font-bold mb-6">Edit Appointment</h1>

            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <form th:action="@{/update-appointment}" method="post">
                <input type="hidden" name="appointmentId" th:value="${appointment.appointmentId}" />

                <div class="mb-6">
                    <label class="block mb-1 font-semibold" for="booking-for">Booking For:</label>
                    <input id="booking-for" name="booking-for" type="text" th:value="${appointment.custBookFor}"
                        class="w-full border rounded px-3 py-2 shadow mb-2 bg-gray-100" readonly />
                </div>
                <div class="mb-6">
                    <label class="block font-semibold mb-2">Select Date:</label>
                    <input id="date" name="date" type="date" class="w-full border rounded px-3 py-2 shadow"
                        th:value="${appointment.appointmentDate}"
                        th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required />
                </div>
                <div class="mb-6">
                    <label class="block mb-1 font-semibold">Booking Time:</label>
                    <input id="selected-time" name="selected-time" type="text" th:value="${appointment.appointmentTime}"
                        class="w-full border rounded px-3 py-2 shadow mb-2 bg-gray-100" readonly />
                    <div class="grid grid-cols-6 gap-2">
                        <th:block th:each="slot : ${slots}">
                            <label class="flex items-center space-x-1">
                                <input type="radio" name="slot" th:value="${slot}" class="slot-radio"
                                    th:checked="${slot == appointment.appointmentTime}"
                                    th:disabled="${unavailableBarbersBySlot[slot] != null && unavailableBarbersBySlot[slot].size() == barbers.size() && slot != appointment.appointmentTime}"
                                    required />
                                <span th:text="${slot}"></span>
                            </label>
                        </th:block>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block mb-1 font-semibold" for="category">Customer Category:</label>
                    <select id="category" name="category" class="w-full border rounded px-3 py-2 shadow bg-gray-100"
                        disabled>
                        <option th:selected="${appointment.custType == 'Child'}">Child</option>
                        <option th:selected="${appointment.custType == 'Teen'}">Teen</option>
                        <option th:selected="${appointment.custType == 'Adult'}">Adult</option>
                        <option th:selected="${appointment.custType == 'Senior'}">Senior</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block mb-1 font-semibold" for="barber">Select Barber:</label>
                    <select id="barber" name="barber" class="w-full border rounded px-3 py-2 shadow" required>
                        <option value="" disabled>-- Select Barber --</option>
                        <th:block th:each="barber : ${barbers}">
                            <option th:value="${barber.staffId}" th:text="${barber.staffName}"
                                th:selected="${barber.staffId == appointment.barberId}"
                                th:style="${unavailableBarbersBySlot[appointment.appointmentTime] != null && unavailableBarbersBySlot[appointment.appointmentTime].contains(barber.staffId) && barber.staffId != appointment.barberId ? 'display:none' : ''}">
                            </option>
                        </th:block>
                    </select>
                </div>
                <div class="flex space-x-4">
                    <button type="submit"
                        class="bg-blue-500 text-white px-5 py-2 rounded shadow hover:bg-blue-600 transition">
                        Update Appointment
                    </button>
                    <a th:href="@{/view-appointment}"
                        class="bg-gray-500 text-white px-5 py-2 rounded shadow hover:bg-gray-600 transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:inline="javascript">
        let unavailableBarbersBySlot = /*[[${unavailableBarbersBySlot}]]*/ {};
        const currentAppointmentId = /*[[${appointment.appointmentId}]]*/ 0;
        const currentSlot = /*[[${appointment.appointmentTime}]]*/ '';
        const currentBarberId = /*[[${appointment.barberId}]]*/ 0;

        document.getElementById('date').addEventListener('change', function () {
            const selectedDate = this.value;
            // Note: Ideally we should use a new endpoint that handles exclusion logic, 
            // but reusing /booking/unavailable is defined to just return raw availability.
            // Client side logic will handle the "if it's my current appointment, allow it" logic
            // but wait, /booking/unavailable helps disable slots. 
            // If I change date, I am moving AWAY from my current booked slot in current date.
            // So standard availability check is actually correct for a NEW date.
            // If I stay on SAME date, I need special handling.

            fetch('/booking/unavailable?date=' + selectedDate)
                .then(r => r.json())
                .then(data => {
                    unavailableBarbersBySlot = data.unavailableBarbersBySlot;
                    const radios = document.querySelectorAll('.slot-radio');
                    radios.forEach(radio => {
                        // If we changed date, we treat it as fresh booking regarding availability
                        // UNLESS we eventually support "same date different year" which is unlikely.
                        // Assuming date change means completely new slot selection context.
                        radio.checked = false;
                        const unavailableCount = (unavailableBarbersBySlot[radio.value] || []).length;
                        radio.disabled = (unavailableCount >= data.totalBarbers);
                    });
                    document.getElementById('selected-time').value = '--:-- --';
                    document.getElementById('barber').selectedIndex = 0;
                });
        });

        document.querySelectorAll('.slot-radio').forEach(radio => {
            radio.addEventListener('change', function () {
                const slot = this.value;
                document.getElementById('selected-time').value = slot;
                const barberSelect = document.getElementById('barber');
                const unavailableForSlot = unavailableBarbersBySlot[slot] || [];

                Array.from(barberSelect.options).forEach(opt => {
                    if (opt.value === "") return;

                    // Logic: Is this barber unavailable for this slot?
                    let isUnavailable = unavailableForSlot.some(id => id.toString() === opt.value.toString());

                    // Exception: If this is my current booking (Same Date, Same Time, Same Barber), it IS available.
                    // But here we are just checking slot+barber. 
                    // If I select my current slot, my current barber ID will be in "unavailableForSlot" (because I occupy it).
                    // So I must exclude myself. 
                    // However, 'unavailableForSlot' comes from server which doesn't know who 'I' am in the context of this fetch if using generic endpoint.
                    // BUT: For initial page load, `unavailableBarbersBySlot` passed from controller SHOULD exclude me if I used logic?
                    // No, `getUnavailableBarbersBySlot` in controller checks pure database.
                    // So: I need to know "If slot == currentSlot AND opt.value == currentBarberId" -> Allow.

                    const isMyCurrentBooking = (slot === currentSlot && opt.value.toString() === currentBarberId.toString() && document.getElementById('date').value === /*[[${appointment.appointmentDate}]]*/ '');

                    if (isMyCurrentBooking) {
                        isUnavailable = false;
                    }

                    opt.style.display = isUnavailable ? "none" : "";
                    opt.disabled = isUnavailable;
                });
                // Reset selection if hidden
                if (barberSelect.selectedOptions[0].style.display === 'none') {
                    barberSelect.value = "";
                }
            });
        });
    </script>
</body>

</html>
