<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col min-h-screen" style="font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);margin:0">
<style>
    .fb-card{background:#fff;border:2px solid var(--line,#e2d9c8);border-radius:6px;padding:30px;max-width:560px;margin:40px auto}
    .fb-title{font-family:'Bebas Neue';font-size:42px;line-height:1.05;letter-spacing:.03em;margin:0 0 20px;color:#1c1a17}
    .fb-label{display:block;font-weight:600;font-size:.9rem;margin:18px 0 8px;color:#1c1a17}
    .star{font-size:2rem !important;color:#d9d0bf !important;transition:color .12s ease,transform .12s ease}
    .star:hover{transform:scale(1.15)}
    .star.active,.star.text-yellow-400{color:var(--brass,#b08d57) !important}
    textarea[name=feedback]{width:100%;min-height:130px;padding:13px;border:2px solid var(--line,#e2d9c8);border-radius:5px;background:#fff;font-family:'Inter';font-size:.95rem;resize:none}
    textarea[name=feedback]:focus{outline:none;border-color:var(--brass,#b08d57)}
    .fb-submit{display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--oxblood,#7d1f2e);color:#fff;border:none;border-radius:5px;padding:13px 28px;font-family:'Bebas Neue';font-size:21px;letter-spacing:.09em;cursor:pointer}
    .fb-submit:hover{filter:brightness(1.12)}
    .fb-delete{background:transparent;color:#b3122f;border:2px solid #b3122f;border-radius:5px;padding:11px 22px;font-weight:700;font-size:.9rem;cursor:pointer}
    .fb-error{background:#fdeaea;border-left:4px solid #b3122f;color:#b3122f;padding:10px 14px;border-radius:0 4px 4px 0;font-weight:600;font-size:.92rem;margin-bottom:18px}
</style>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main style="flex:1;width:100%;max-width:680px;margin:0 auto;padding:40px 24px 72px">
    <div class="fb-card">
        <h1 class="fb-title">Share your feedback</h1>
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <div class="flex items-center">
                    <svg class="fill-current w-6 h-6 mr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path
                            d="M2.93 17.07A10 10 0 1 1 17.07 2.93 10 10 0 0 1 2.93 17.07zm12.73-1.41A8 8 0 1 0 4.34 4.34a8 8 0 0 0 11.32 11.32zM9 11V9h2v6H9v-4zm0-6h2v2H9V5z" />
                    </svg>
                    <div>
                        <p class="font-bold">Error</p>
                        <p class="text-sm" th:text="${error}">Error message here</p>
                    </div>
                </div>
                <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer"
                    onclick="this.parentElement.style.display='none';">
                    <svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20">
                        <title>Close</title>
                        <path
                            d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1-1.697 1.697z" />
                    </svg>
                </span>
            </div>
            <form th:action="@{/feedback}" method="post">
                <input type="hidden" name="appointmentId" th:value="${appointmentId}" />
                <div class="mb-4">
                    <label class="block text-lg font-semibold mb-2">Your Rating:</label>
                    <div class="flex space-x-1" id="star-rating">
                        <span th:each="i : ${#numbers.sequence(1, 5)}" th:attr="data-value=${i}"
                            class="star text-gray-400 text-2xl cursor-pointer">&#9733;</span>
                    </div>
                    <input type="hidden" name="rating" id="rating-input" th:value="${existingFeedback?.rating ?: 0}"
                        required />
                </div>
                <div>
                    <label class="fb-label">Your feedback:</label>
                    <textarea name="feedback"
                        th:text="${existingFeedback?.comments}" required></textarea>
                </div>
                <div style="display:flex;gap:14px;margin-top:24px">
                    <button type="submit" class="fb-submit">
                        Submit Feedback
                    </button>
                    <button type="button" th:if="${existingFeedback != null}"
                        onclick="document.getElementById('deleteForm').submit()"
                        class="fb-delete hidden">
                        Delete Feedback
                    </button>
                </div>
            </form>
            <form id="deleteForm" th:action="@{/delete-feedback}" method="post" style="display:none">
                <input type="hidden" name="appointmentId" th:value="${appointmentId}" />
            </form>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:inline="javascript">
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('rating-input');
        let currentRating = parseInt(ratingInput.value) || 0;

        function updateStars(val) {
            stars.forEach((s, idx) => {
                s.classList.toggle('text-yellow-400', idx < val);
                s.classList.toggle('text-gray-400', idx >= val);
            });
        }

        stars.forEach((s, idx) => {
            s.addEventListener('click', () => {
                currentRating = idx + 1;
                ratingInput.value = currentRating;
                updateStars(currentRating);
            });
            s.addEventListener('mouseover', () => updateStars(idx + 1));
            s.addEventListener('mouseout', () => updateStars(currentRating));
        });

        updateStars(currentRating);
    </script>
</body>

</html>
