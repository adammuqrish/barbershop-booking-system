<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments/header :: head}"></div>
</head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-4 flex-grow justify-center">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-5xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">Your Current Appointments:</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <th:block th:each="appt : ${appointments}">
                    <div class="bg-white p-6 rounded-lg shadow-md border flex flex-col justify-between">
                        <div>
                            <p><strong>Book For:</strong> <span th:text="${appt.custBookFor}"></span></p>
                            <p><strong>Date:</strong> <span th:text="${appt.appointmentDate}"></span></p>
                            <p><strong>Time:</strong> <span th:text="${appt.appointmentTime}"></span></p>
                            <p><strong>Barber:</strong> <span th:text="${appt.appointmentBarber}"></span></p>
                            <p><strong>Status:</strong> <span th:text="${appt.paymentStatus}"></span></p>
                        </div>
                        <div class="flex gap-2 mt-4 justify-end">
                            <a th:href="@{/receipt(appointmentId=${appt.appointmentId}, source='view-appointment')}"
                                class="bg-blue-200 text-blue-800 px-3 py-1 rounded text-sm">View Receipt</a>
                            <button class="bg-red-500 text-white px-3 py-1 rounded text-sm"
                                th:onclick="'showCancelModal(' + ${appt.appointmentId} + ')'">Cancel</button>
                            <form th:id="'cancelForm-' + ${appt.appointmentId}" th:action="@{/cancel-appointment}"
                                method="post" style="display:none;">
                                <input type="hidden" name="appointmentId" th:value="${appt.appointmentId}" />
                            </form>
                        </div>
                    </div>
                </th:block>
                <p th:if="${#lists.isEmpty(appointments)}">No appointments found.</p>
            </div>
        </div>
    </main>

    <div id="cancelModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 z-50 hidden">
        <div class="bg-white rounded-lg shadow-lg p-6 w-80">
            <h2 class="text-lg font-semibold mb-4">Cancel Appointment</h2>
            <p class="mb-6">Are you sure?</p>
            <div class="flex justify-end gap-2">
                <button onclick="hideCancelModal()" class="px-4 py-1 rounded bg-gray-300">No</button>
                <button id="confirmCancelBtn" class="px-4 py-1 rounded bg-red-500 text-white">Yes</button>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script>
        let cancelId = null;
        function showCancelModal(id) {
            cancelId = id;
            document.getElementById('cancelModal').classList.remove('hidden');
        }
        function hideCancelModal() {
            document.getElementById('cancelModal').classList.add('hidden');
        }
        document.getElementById('confirmCancelBtn').onclick = () => {
            if (cancelId) document.getElementById('cancelForm-' + cancelId).submit();
        };
    </script>
</body>

</html>
