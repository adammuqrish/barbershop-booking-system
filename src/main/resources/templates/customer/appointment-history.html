<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-4 flex-grow justify-center">
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-5xl mx-auto">
            <!-- TAMBAH NI DALAM appointment-history.html -->
            <div th:if="${success}"
                class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
                <span class="absolute top-0 bottom-0 right-0 px-4 py-3 cursor-pointer"
                    onclick="this.parentElement.style.display='none';">
                    <svg class="fill-current h-6 w-6 text-green-500" role="button" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20">
                        <title>Close</title>
                        <path
                            d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1-1.697 1.697z" />
                    </svg>
                </span>
            </div>
            <h1 class="text-2xl font-bold mb-6">Appointment History:</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- ✅ GUNA FILTERED APPOINTMENTS -->
                <th:block th:each="appt : ${appointments}">
                    <div class="bg-white p-6 rounded-lg shadow-md border">
                        <p><strong>Book For:</strong> <span th:text="${appt.custBookFor}"></span></p>
                        <p><strong>Date:</strong> <span th:text="${appt.appointmentDate}"></span></p>
                        <p><strong>Time:</strong> <span th:text="${appt.appointmentTime}"></span></p>
                        <p><strong>Payment:</strong> <span th:text="${appt.paymentStatus}"></span></p>
                        <p><strong>Service:</strong> <span th:text="${appt.serviceStatus}"></span></p>

                        <div class="flex gap-2 mt-4 justify-end">

                            <!-- ✅ 1. FEEDBACK BUTTON (Hanya kalau Service = Done) -->
                            <a th:if="${#strings.equalsIgnoreCase(appt.serviceStatus, 'done')}"
                                th:href="@{/feedback(appointmentId=${appt.appointmentId})}"
                                class="inline-block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-300 transition">
                                Give Feedback
                            </a>

                            <!-- ✅ 2. RECEIPT BUTTON -->
                            <a th:href="@{/receipt(appointmentId=${appt.appointmentId}, source='appointment-history')}"
                                class="inline-block bg-blue-200 text-blue-800 px-4 py-2 rounded hover:bg-blue-300 transition">
                                View Receipt
                            </a>

                        </div>
                    </div>
                </th:block>
            </div>

            <!-- ✅ TAMBAH NI: Jika tiada appointment dalam history -->
            <div th:if="${#lists.isEmpty(appointments)}" class="text-center text-gray-500 mt-4">
                <p>No completed or cancelled appointments found.</p>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
