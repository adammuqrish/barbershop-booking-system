<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}">
    <title>Appointment History — Hugi Barbershop</title>
</head>

<body class="flex flex-col min-h-screen" style="font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);margin:0">

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main style="flex:1;width:100%;max-width:960px;margin:0 auto;padding:40px 24px 72px">

    <h1 style="font-family:'Bebas Neue';font-size:42px;line-height:1.05;letter-spacing:.03em;margin:0 0 6px">Your appointments</h1>
    <p class="hint" style="color:var(--muted);margin:0 0 26px">Completed and past visits, with receipts.</p>

    <!-- Success flash -->
    <div th:if="${success}" role="status"
         style="background:#eef7ee;border-left:4px solid #2e7d32;color:#2e7d32;padding:12px 16px;border-radius:0 4px 4px 0;font-size:.92rem;font-weight:600;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center">
        <span th:text="${success}">Success</span>
        <button type="button" onclick="this.parentElement.style.display='none'"
                style="background:none;border:none;color:#2e7d32;font-weight:800;cursor:pointer;font-size:1rem" aria-label="Dismiss">✕</button>
    </div>

    <style>
        .appt-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        @media(max-width:760px){.appt-grid{grid-template-columns:1fr}}
        .appt-card{background:#fff;border:2px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column}
        .appt-card .who{font-family:'Bebas Neue';font-size:24px;letter-spacing:.05em;margin-bottom:8px}
        .appt-meta{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:.92rem;margin-bottom:14px}
        .appt-meta dt{color:var(--muted)}
        .appt-meta dd{margin:0;font-weight:600}
        .badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
        .badge-paid{background:#eef7ee;color:#2e7d32;border:1px solid #bfe3bf}
        .badge-pending{background:#fdf3e3;color:#8a5a00;border:1px solid #ecd9ae}
        .badge-cancelled{background:#fdeaea;color:#b3122f;border:1px solid #f3c1c1}
        .badge-done{background:#eef2fb;color:#274690;border:1px solid #c4d2ef}
        .appt-actions{display:flex;gap:10px;margin-top:auto;justify-content:flex-end;flex-wrap:wrap}
        .btn-sm{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border-radius:4px;padding:9px 16px;font-size:.88rem;font-weight:700;transition:filter .15s ease}
        .btn-sm:hover{filter:brightness(1.1)}
        .btn-feedback{background:var(--ink);color:var(--brass)}
        .btn-receipt{background:transparent;color:var(--oxblood);border:2px solid var(--oxblood)}
    </style>

    <div class="appt-grid">
        <th:block th:each="appt : ${appointments}">
            <div class="appt-card">
                <span class="who" th:text="${appt.custBookFor}">Name</span>
                <dl class="appt-meta">
                    <dt>Date</dt><dd th:text="${appt.appointmentDate}"></dd>
                    <dt>Time</dt><dd th:text="${appt.appointmentTime}"></dd>
                </dl>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
                    <span class="badge"
                          th:classappend="${appt.paymentStatus == 'completed'} ? 'badge-paid' : (${appt.serviceStatus == 'cancelled'} ? 'badge-cancelled' : 'badge-pending')"
                          th:text="'Payment: ' + ${appt.paymentStatus}">Payment</span>
                    <span class="badge"
                          th:classappend="${#strings.equalsIgnoreCase(appt.serviceStatus, 'done')} ? 'badge-done' : (${appt.serviceStatus == 'cancelled'} ? 'badge-cancelled' : 'badge-pending')"
                          th:text="'Service: ' + ${appt.serviceStatus}">Service</span>
                </div>
                <div class="appt-actions">
                    <a th:if="${#strings.equalsIgnoreCase(appt.serviceStatus, 'done')}"
                       th:href="@{/feedback(appointmentId=${appt.appointmentId})}"
                       class="btn-sm btn-feedback">Give Feedback</a>
                    <a th:href="@{/receipt(appointmentId=${appt.appointmentId}, source='appointment-history')}"
                       class="btn-sm btn-receipt">View Receipt</a>
                </div>
            </div>
        </th:block>
    </div>

    <div th:if="${#lists.isEmpty(appointments)}"
         style="text-align:center;background:#fff;border:2px dashed var(--line);border-radius:6px;padding:44px 20px;margin-top:10px">
        <p style="font-family:'Bebas Neue';font-size:26px;letter-spacing:.06em;margin:0 0 6px">Nothing here yet</p>
        <p style="color:var(--muted);margin:0 0 18px">No completed or cancelled appointments found.</p>
        <a th:href="@{/booking}" class="btn-sm btn-feedback" style="text-decoration:none">Book an appointment</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
