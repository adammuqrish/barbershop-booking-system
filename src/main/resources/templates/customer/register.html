<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/header :: head_tags}"></th:block>
    <style>
        .form-container {
            position: relative;
            overflow: hidden;
        }

        .panel {
            width: 50%;
            height: 100%;
            position: relative;
            transition: opacity 0.5s, z-index 0.5s;
        }

        .panel.inactive {
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        .panel.active {
            opacity: 1;
            z-index: 2;
            pointer-events: auto;
        }

        .sliding-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            transition: left 0.5s cubic-bezier(0.23, 1, 0.32, 1), border-radius 0.5s;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #101820;
            padding: 2rem;
            border-top-left-radius: 1rem;
            border-bottom-left-radius: 1rem;
        }

        .sliding-panel.right {
            left: 50%;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border-top-right-radius: 1rem;
            border-bottom-right-radius: 1rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 3rem 2.5rem 2.5rem 2.5rem;
            text-align: center;
            position: relative;
            min-width: 320px;
            max-width: 90vw;
            animation: popin 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes popin {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-checkmark,
        .modal-xmark {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .modal-checkmark svg,
        .modal-xmark svg {
            width: 64px;
            height: 64px;
        }

        .modal-checkmark .circle {
            stroke: #22c55e;
            stroke-width: 4;
            fill: none;
            animation: checkmark-circle 0.4s ease;
        }

        .modal-checkmark .check {
            stroke: #22c55e;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: checkmark-draw 0.4s 0.2s forwards;
        }

        @keyframes checkmark-draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        .modal-xmark .circle {
            stroke: #ef4444;
            stroke-width: 4;
            fill: none;
            animation: xmark-circle 0.4s ease;
        }

        .modal-xmark .x {
            stroke: #ef4444;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: xmark-draw 0.4s 0.2s forwards;
        }
    </style>
</head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>
    <main class="flex flex-col items-center mx-3 my-4 flex-grow justify-center">
        <div class="form-container bg-white rounded-2xl shadow-xl w-full max-w-3xl mx-4 md:mx-auto overflow-hidden"
            style="height: 600px;">
            <div class="flex w-full h-full relative">
                <div id="login-form-container" class="panel active bg-gray-100 p-8 flex flex-col justify-center">
                    <h2 class="text-2xl font-bold mb-6">Login</h2>
                    <form id="login-form" class="space-y-4" th:action="@{/auth}" method="post">
                        <input type="hidden" name="action" value="login">
                        <div>
                            <label class="block text-gray-700 mb-1">Email</label>
                            <input type="email" name="email" class="w-full p-2 border border-gray-300 rounded" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-1">Password</label>
                            <input type="password" name="password" class="w-full p-2 border border-gray-300 rounded"
                                required>
                        </div>
                        <button type="submit"
                            class="bg-[#101820] text-white py-2 px-6 rounded-full hover:bg-gray-800 transition-colors">
                            Login
                        </button>
                    </form>
                </div>
                <div id="register-form-container"
                    class="panel inactive bg-gray-100 p-8 flex flex-col justify-center absolute top-0 right-0 h-full">
                    <h2 class="text-2xl font-bold mb-6">Register</h2>
                    <form id="register-form" class="space-y-4" th:action="@{/auth}" method="post">
                        <input type="hidden" name="action" value="register">
                        <div>
                            <label class="block text-gray-700 mb-1">Name</label>
                            <input type="text" name="name" class="w-full p-2 border border-gray-300 rounded" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-1">Email</label>
                            <input type="email" name="email" class="w-full p-2 border border-gray-300 rounded" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-1">Phone Number</label>
                            <input type="tel" name="phone" class="w-full p-2 border border-gray-300 rounded" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-1">Password</label>
                            <input type="password" name="password" class="w-full p-2 border border-gray-300 rounded"
                                required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-1">Confirm Password</label>
                            <input type="password" name="confirmPassword"
                                class="w-full p-2 border border-gray-300 rounded" required>
                        </div>
                        <button type="submit"
                            class="bg-black text-white py-2 px-6 rounded-full hover:bg-gray-800 transition-colors">
                            Register
                        </button>
                    </form>
                </div>
                <div id="sliding-panel" class="sliding-panel right">
                    <div class="flex-1 flex flex-col items-center justify-center">
                        <div class="mb-10 text-center">
                            <h1 class="text-2xl font-bold mb-1 text-white">HUGI BARBERSHOP</h1>
                            <p class="text-lg text-white">Customer Account</p>
                        </div>
                        <button id="toggle-register"
                            class="bg-white text-black py-2 px-10 rounded-full mb-4">Register</button>
                        <button id="toggle-login" class="bg-white text-black py-2 px-10 rounded-full"
                            style="display:none;">Login</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const slidingPanel = document.getElementById('sliding-panel');
            const registerFormContainer = document.getElementById('register-form-container');
            const loginFormContainer = document.getElementById('login-form-container');
            const toggleLoginBtn = document.getElementById('toggle-login');
            const toggleRegisterBtn = document.getElementById('toggle-register');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');

            function showModal(success, message, redirectUrl) {
                modalContent.innerHTML = success
                    ? `<div class="modal-checkmark"><svg viewBox="0 0 64 64"><circle class="circle" cx="32" cy="32" r="28"/><polyline class="check" points="18,34 28,44 46,22"/></svg></div><h3 class="text-green-600 text-xl font-semibold mb-2">Success</h3><div class="text-gray-700">${message}</div>`
                    : `<div class="modal-xmark"><svg viewBox="0 0 64 64"><circle class="circle" cx="32" cy="32" r="28"/><line class="x" x1="22" y1="22" x2="42" y2="42"/><line class="x" x1="42" y1="22" x2="22" y2="42"/></svg></div><h3 class="text-red-600 text-xl font-semibold mb-2">Failed</h3><div class="text-gray-700">${message}</div>`;
                modalOverlay.classList.add('show');
                setTimeout(() => {
                    modalOverlay.classList.remove('show');
                    if (success && redirectUrl) window.location.href = redirectUrl;
                }, 2000);
            }

            const justLoggedIn = /*[[${justLoggedIn}]]*/ false;
            const successMessage = /*[[${successMessage}]]*/ null;
            const error = /*[[${error}]]*/ null;

            if (justLoggedIn) showModal(true, "Login successful! Redirecting...", "/index");
            else if (successMessage) showModal(true, successMessage);
            else if (error) showModal(false, error);

            toggleRegisterBtn.addEventListener('click', () => {
                slidingPanel.classList.remove('right');
                loginFormContainer.classList.add('inactive');
                registerFormContainer.classList.remove('inactive');
                toggleRegisterBtn.style.display = 'none';
                toggleLoginBtn.style.display = 'block';
            });

            toggleLoginBtn.addEventListener('click', () => {
                slidingPanel.classList.add('right');
                registerFormContainer.classList.add('inactive');
                loginFormContainer.classList.remove('inactive');
                toggleRegisterBtn.style.display = 'block';
                toggleLoginBtn.style.display = 'none';
            });
        });
        // Cari elemen input phone
        const phoneInput = document.querySelector('input[name="phone"]');

        if (phoneInput) {
            // Tambah event listener bila user menaip
            phoneInput.addEventListener('input', function () {

                // 1. Buang semua aksara BUKAN nombor (0-9)
                this.value = this.value.replace(/[^0-9]/g, '');

            });
        }
    </script>
</body>

</html>
