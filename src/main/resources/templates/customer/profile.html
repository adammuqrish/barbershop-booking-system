<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="flex flex-col h-screen justify-between bg-yellow-100">
    <nav th:replace="~{fragments/nav :: nav}"></nav>
    <main class="flex flex-col items-center mx-3 my-20 flex-grow">
        <div class="w-full max-w-3xl p-6 rounded-2xl bg-white shadow-xl border border-gray-200">
            <h1 class="text-2xl font-extrabold mb-6 text-gray-800 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                My Profile
            </h1>
            <div th:if="${success}"
                class="p-4 mb-4 text-green-800 border border-green-400 rounded-lg bg-green-50"
                role="alert">
                <div class="flex items-center justify-between">
                    <span class="font-medium" th:text="${success}"></span>
                    <button type="button"
                        class="text-green-800 bg-transparent hover:bg-green-200 hover:text-green-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-700 dark:hover:text-white"
                        onclick="this.parentElement.parentElement.remove()">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd"
                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex flex-col md:flex-row gap-6">
                <!-- Left box (Loyalty) -->
                <div class="bg-gray-100 rounded-xl p-4 flex flex-col items-center w-full md:w-1/3">
                    <div
                        class="w-20 h-20 bg-gray-300 rounded-full mb-3 flex items-center justify-center overflow-hidden">
                        <img th:if="${customer.custPicture != null}"
                            th:src="@{'/resources/uploads/' + ${customer.custPicture}}"
                            class="w-full h-full object-cover" alt="Profile Picture" />
                        <svg th:unless="${customer.custPicture != null}" class="w-12 h-12 text-gray-400"
                            fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <p class="text-sm font-medium text-gray-600">Loyalty Points</p>
                    <p class="text-2xl font-extrabold text-green-600" th:text="${customer.custLoyaltyPoints}"></p>
                </div>

                <!-- Right box (Details) -->
                <div class="flex-1 space-y-4 text-left">
                    <div>
                        <p class="text-sm text-gray-500">Name</p>
                        <p class="text-lg font-semibold text-gray-800" th:text="${customer.custName}"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Phone Number</p>
                        <p class="text-lg font-semibold text-gray-800" th:text="${customer.custPhoneNumber}"></p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Email</p>
                        <p class="text-lg font-semibold text-gray-800" th:text="${customer.custEmail}"></p>
                    </div>
                </div>
            </div>

            <a th:href="@{/edit-profile}" class="block mt-6">
                <button
                    class="w-full bg-green-500 text-white rounded py-2 px-4 shadow-md hover:bg-green-600 transition">Edit
                    Profile</button>
            </a>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
