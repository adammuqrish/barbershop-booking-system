<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}">
    <title>My Profile — Hugi Barbershop</title>
</head>

<body class="flex flex-col min-h-screen" style="font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);margin:0">
<style>
    .pf-wrap{width:100%;max-width:760px;margin:0 auto;padding:40px 24px 72px}
    .pf-title{font-family:'Bebas Neue';font-size:42px;line-height:1.05;letter-spacing:.03em;margin:0 0 26px;color:#1c1a17}
    .pf-card{background:#fff;border:2px solid var(--line,#e2d9c8);border-radius:6px;overflow:hidden}
    .pf-head{background:var(--ink,#1c1a17);padding:26px 30px;display:flex;align-items:center;gap:18px}
    .pf-head .hb-avatar-lg{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid var(--brass,#b08d57)}
    .pf-initial{display:inline-grid;place-items:center;width:74px;height:74px;border-radius:50%;background:var(--brass,#b08d57);color:var(--ink,#1c1a17);font-family:'Bebas Neue';font-size:38px;border:3px solid rgba(245,239,228,.35)}
    .pf-head-name{font-family:'Bebas Neue';font-size:30px;letter-spacing:.06em;color:var(--cream,#f5efe4);margin:0;line-height:1}
    .pf-head-sub{font-size:.85rem;color:var(--brass,#b08d57);margin:5px 0 0;letter-spacing:.05em}
    .pf-body{display:flex;gap:0;flex-wrap:wrap}
    @media(min-width:640px){.pf-loyalty{border-right:2px dashed var(--line,#e2d9c8)}}
    .pf-loyalty{padding:28px 30px;text-align:center;background:#fdfaf3;min-width:200px;flex:1;display:flex;flex-direction:column;justify-content:center}
    .pf-details{flex:1.4;padding:28px 30px}
    .pf-points{font-family:'Bebas Neue';font-size:56px;line-height:1;color:var(--oxblood,#7d1f2e);margin:4px 0 2px}
    .pf-label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9a938a;margin-bottom:4px}
    .pf-value{font-size:1.02rem;font-weight:600;color:#1c1a17;margin:0 0 16px;word-break:break-all}
    .pf-actions{padding:20px 30px;border-top:2px solid var(--line,#e2d9c8);display:flex;gap:12px;flex-wrap:wrap}
    .pf-btn-edit{display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--oxblood,#7d1f2e);color:#fff;text-decoration:none;border-radius:5px;padding:12px 26px;font-family:'Bebas Neue';font-size:19px;letter-spacing:.08em;transition:filter .15s ease}
    .pf-btn-edit:hover{filter:brightness(1.12)}
    .pf-btn-book{display:inline-block;background:transparent;color:var(--oxblood,#7d1f2e);text-decoration:none;border:2px solid var(--oxblood,#7d1f2e);border-radius:5px;padding:10px 22px;font-weight:700;font-size:.9rem}
    .pf-success{background:#eef7ee;border-left:4px solid #2e7d32;color:#2e7d32;padding:12px 16px;border-radius:0 4px 4px 0;font-size:.92rem;font-weight:600;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center}
</style>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main style="flex:1">
    <div class="pf-wrap">
        <h1 class="pf-title">My profile</h1>

        <div th:if="${success}" class="pf-success" role="status">
            <span th:text="${success}">Saved</span>
            <button type="button" onclick="this.parentElement.remove()"
                    style="background:none;border:none;color:#2e7d32;font-weight:800;cursor:pointer;font-size:1rem" aria-label="Dismiss">✕</button>
        </div>

        <div class="pf-card">
            <!-- Header band -->
            <div class="pf-head">
                <img th:if="${customer.custPicture != null}"
                     th:src="@{'/resources/uploads/' + ${customer.custPicture}}"
                     alt="Profile picture" class="hb-avatar-lg" />
                <span th:unless="${customer.custPicture != null}" class="pf-initial"
                      th:text="${#strings.substring(customer.custName, 0, 1)}">U</span>
                <div>
                    <p class="pf-head-name" th:text="${customer.custName}">Name</p>
                    <p class="pf-head-sub">VALUED CUSTOMER</p>
                </div>
            </div>

            <div class="pf-body">
                <!-- Loyalty -->
                <div class="pf-loyalty">
                    <span class="pf-label">Loyalty points</span>
                    <span class="pf-points" th:text="${customer.custLoyaltyPoints}">0</span>
                    <span style="font-size:.78rem;color:#9a938a" th:if="${customer.custLoyaltyPoints != null and customer.custLoyaltyPoints >= 2}">★ Next cut is FREE</span>
                    <span style="font-size:.78rem;color:#9a938a" th:unless="${customer.custLoyaltyPoints != null and customer.custLoyaltyPoints >= 2}"
                          th:text="${2 - (customer.custLoyaltyPoints ?: 0)} + ' more to a FREE cut'"></span>
                </div>

                <!-- Details -->
                <div class="pf-details">
                    <p class="pf-label">Phone number</p>
                    <p class="pf-value" th:text="${customer.custPhoneNumber}"></p>
                    <p class="pf-label">Email</p>
                    <p class="pf-value" th:text="${customer.custEmail}"></p>
                </div>
            </div>

            <!-- Actions -->
            <div class="pf-actions">
                <a th:href="@{/edit-profile}" class="pf-btn-edit">Edit Profile</a>
                <a th:href="@{/booking}" class="pf-btn-book">Book an appointment</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
