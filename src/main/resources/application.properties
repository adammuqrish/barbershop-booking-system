# ========================
# \uD83C\uDF0D SERVER CONFIG
# ========================
server.port=${PORT:8080}

# ========================
# \uD83E\uDDE0 DATABASE CONFIG
# ========================
# Credentials come from Heroku config vars (JDBC_DATABASE_URL / JDBC_DATABASE_USERNAME / JDBC_DATABASE_PASSWORD).
# For local dev, set these env vars or use a local application-local.properties.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ========================
# ⚙️ JPA / Hibernate Settings
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========================
# 🔄 Flyway Database Migrations
# ========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========================
# 📦 Upload storage (external dir; override with APP_UPLOAD_DIR on Heroku)
# ========================
app.upload.dir=${APP_UPLOAD_DIR:${user.dir}/uploads}

# ========================
# Thymeleaf & Dev Tools
# ========================
spring.thymeleaf.cache=true

# ========================
# Logging (prod defaults; enable DEBUG locally via application-local.properties)
# ========================
logging.level.root=INFO
logging.level.com.heroku.java=INFO

