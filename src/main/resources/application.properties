# ========================
# \uD83C\uDF0D SERVER CONFIG
# ========================
server.port=${PORT:8080}

# ========================
# \uD83E\uDDE0 DATABASE CONFIG (Auto switch between local & Heroku)
# ========================

# --- Heroku (DATABASE_URL environment variable) ---
spring.datasource.url=${JDBC_DATABASE_URL:}
spring.datasource.username=${JDBC_DATABASE_USERNAME:}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.hikari.data-source-properties.sslmode=require

# --- Local fallback (used when running on your laptop) ---
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:yourpassword}

# ========================
# \u2699\uFE0F JPA / Hibernate Settings
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# \uD83E\uDDE9 Thymeleaf & Dev Tools
# ========================
spring.thymeleaf.cache=false
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# ========================
# \uD83E\uDEB5 Logging
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
