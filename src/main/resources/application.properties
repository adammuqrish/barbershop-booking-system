# ========================
# \uD83C\uDF0D SERVER CONFIG
# ========================
server.port=${PORT:8080}

# ========================
# \uD83E\uDDE0 DATABASE CONFIG
# ========================
# Credentials come from Heroku config vars (JDBC_DATABASE_URL / JDBC_DATABASE_USERNAME / JDBC_DATABASE_PASSWORD).
# For local dev, set these env vars or use a local application-local.properties.
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ========================
# ⚙️ JPA / Hibernate Settings
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================
# 🔄 Flyway Database Migrations
# ========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========================
# \uD83E\uDDE9 Thymeleaf & Dev Tools
# ========================
spring.thymeleaf.cache=false
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# ========================
# dY?? Logging
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.heroku.java=DEBUG
logging.level.org.springframework.security=DEBUG

